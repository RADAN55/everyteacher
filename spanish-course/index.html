k students or families about citizenship, \"papers,\" or immigration status, and do not comment on it. Questions like these can frighten families and keep children away from school.", "Follow your district's enrollment procedures. If a family shares information about status, keep it confidential and do not repeat or record it."]]], "phrases": [["Good afternoon. Am I speaking with ___'s mom / dad?", "Buenas tardes. ¿Hablo con la mamá / el papá de ___?", "BWEH-nahs TAHR-dehs. AH-bloh kohn lah mah-MAH / ehl pah-PAH deh"], ["This is ___, ___'s teacher. (female / male)", "Habla la maestra ___, la maestra de ___. / Habla el maestro ___, el maestro de ___.", "AH-blah lah mah-EHS-trah / ehl mah-EHS-troh"], ["Everything is fine.", "Todo está bien.", "TOH-doh ehs-TAH BYEHN"], ["I'm calling with good news.", "Le llamo con buenas noticias.", "leh YAH-moh kohn BWEH-nahs noh-TEE-syahs"], ["Your son / daughter worked hard today.", "Su hijo / Su hija trabajó mucho hoy.", "soo EE-hoh / soo EE-hah trah-bah-HOH MOO-choh OY"], ["Thank you for your support.", "Gracias por su apoyo.", "GRAH-syahs pohr soo ah-POH-yoh"], ["Have a good day.", "Que tenga un buen día.", "keh TEHN-gah oon BWEHN DEE-ah"], ["Welcome. Come in, please.", "Bienvenidos. Pase, por favor.", "byehn-beh-NEE-dohs. PAH-seh, pohr fah-BOHR"], ["Have a seat, please.", "Siéntese, por favor.", "SYEHN-teh-seh, pohr fah-BOHR"], ["What language do you prefer?", "¿Qué idioma prefiere?", "KEH ee-DYOH-mah preh-FYEH-reh"], ["Would you like an interpreter?", "¿Quiere un intérprete?", "KYEH-reh oon een-TEHR-preh-teh"], ["An interpreter is going to help us.", "Un intérprete nos va a ayudar.", "oon een-TEHR-preh-teh nohs BAH ah ah-yoo-DAHR"], ["One moment, please.", "Un momento, por favor.", "oon moh-MEHN-toh, pohr fah-BOHR"], ["I'll call you back with an interpreter.", "Le vuelvo a llamar con un intérprete.", "leh BWEHL-boh ah yah-MAHR kohn oon een-TEHR-preh-teh"], ["When is a good time to talk?", "¿Cuándo es un buen momento para hablar?", "KWAHN-doh ehs oon BWEHN moh-MEHN-toh PAH-rah ah-BLAHR"], ["Do you have any questions?", "¿Tiene preguntas?", "TYEH-neh preh-GOON-tahs"], ["Thank you, but we are going to use an interpreter.", "Gracias, pero vamos a usar un intérprete.", "GRAH-syahs, PEH-roh BAH-mohs ah oo-SAHR oon een-TEHR-preh-teh"]], "tip": {"title": "Respect, flexibility, and partnership", "paras": ["Use usted, titles, and last names with family members unless they invite you to do otherwise. Greet everyone who comes, including grandparents and younger siblings.", "Ask each family how and when they prefer to be contacted: phone, text, a messaging app, or notes home. Many parents work long or changing hours, so offer a few different times.", "See families as experts on their children. Ask what the child is good at, what they enjoy at home, and what the family hopes for this year. Then use what you learn in your teaching."]}, "activities": [{"kind": "order", "type": "Sequencing", "title": "Put the good-news call in order", "instr": "Number the lines from 1 to 6 to build a good-news phone call.", "items": ["____  Gracias por su apoyo.", "____  Habla la maestra Smith, la maestra de Daniela.", "____  Que tenga un buen día. Adiós.", "____  Buenas tardes. ¿Hablo con la mamá de Daniela?", "____  Daniela trabajó mucho hoy en matemáticas.", "____  Todo está bien. Le llamo con buenas noticias."], "answers": ["Gracias por su apoyo. = 5", "Habla la maestra Smith... = 2", "Que tenga un buen día. Adiós. = 6", "Buenas tardes. ¿Hablo con la mamá de Daniela? = 1", "Daniela trabajó mucho hoy... = 4", "Todo está bien. Le llamo con buenas noticias. = 3"]}, {"kind": "fill", "type": "Fill-in", "title": "Family phrases", "instr": "Write the missing word.", "items": ["Todo está ____________. (fine)", "Le llamo con buenas ____________. (news)", "Gracias por su ____________. (support)", "Que ____________ un buen día. (to a parent)", "¿Quiere un ____________? (interpreter)", "Pase, por ____________. (please)"], "answers": ["1. bien", "2. noticias", "3. apoyo", "4. tenga", "5. intérprete", "6. favor"]}, {"kind": "scenario", "type": "Scenario", "title": "My Spanish, or an interpreter?", "instr": "For each situation, write P (my phrases are fine) or I (qualified interpreter needed), and explain what you would do.", "items": ["You want to tell a mom that her daughter helped a new classmate today.", "You need to explain to a father why his son was suspended.", "You want to remind a family that picture day is tomorrow.", "A meeting is scheduled to discuss a special education evaluation.", "A student says, \"I can translate for my mom at the conference about my grades.\"", "A front-office worker asks you to find out whether a new family is \"legal.\""], "answers": ["P. A good-news call: Todo está bien. Le llamo con buenas noticias...", "I. Discipline always calls for a qualified interpreter.", "P. A short call or message is fine; also send the school's written notice in Spanish if one is available.", "I. Special education meetings require a qualified interpreter.", "I. Decline kindly: Gracias, pero vamos a usar un intérprete. Never use a student to interpret.", "Do not ask. Public schools may not deny children an education based on immigration status (Plyler v. Doe, 1982). Refer the worker to district enrollment procedures and leaders."]}, {"kind": "roleplay", "type": "Partner role-play", "title": "Opening a conference with an interpreter", "instr": "Work in groups of three: teacher, parent, and interpreter. The teacher opens in Spanish, then speaks directly to the parent in short English sentences while the interpreter interprets. Rotate roles.", "script": [["Teacher", "Buenas tardes, señora. Bienvenida. Pase, por favor. Siéntese, por favor."], ["Teacher", "Un intérprete nos va a ayudar."], ["Teacher (in English)", "Thank you for coming. Daniela is a hard worker."], ["Interpreter", "(interprets)"], ["Teacher", "What does Daniela like to do at home?"], ["Teacher (closing)", "¿Tiene preguntas? ... Gracias por su apoyo."]], "checklist": ["Usted throughout", "Eyes and words to the parent", "Short sentences, pauses", "Asked about strengths at home"], "answers": ["Answers will vary. Check that the teacher addresses the parent directly and never says \"Tell her...\""]}, {"kind": "speak", "type": "Speak aloud", "title": "Leave a voicemail", "instr": "Fill in your name and a student's first name, then leave a practice voicemail on your own phone. Play it back and check your vowels and stress.", "items": ["Buenas tardes.", "Le llama la maestra / el maestro ________, la maestra / el maestro de ________.", "Todo está bien.", "Le llamo con buenas noticias: ________ trabajó mucho hoy.", "Gracias. Adiós."], "answers": ["BWEH-nahs TAHR-dehs.", "leh YAH-mah lah mah-EHS-trah / ehl mah-EHS-troh ... deh ...", "TOH-doh ehs-TAH BYEHN.", "leh YAH-moh kohn BWEH-nahs noh-TEE-syahs ... trah-bah-HOH MOO-choh OY.", "GRAH-syahs. ah-DYOHS."]}], "quiz": [{"q": "Early in a good-news call, you should say:", "opts": ["Tenemos un problema.", "Todo está bien.", "¿Tiene papeles?", "Hasta mañana."], "a": 1}, {"q": "Who should interpret a conference about failing grades?", "opts": ["The student", "An older sibling", "Another parent in the hallway", "A qualified interpreter"], "a": 3}, {"q": "When you work with an interpreter, you should:", "opts": ["Look at and speak directly to the parent", "Say \"Tell her that...\"", "Talk quickly to save time", "Speak only to the interpreter"], "a": 0}, {"q": "Asking a family about immigration status is:", "opts": ["Required at enrollment", "Fine if you are friendly about it", "Something to avoid; children have a right to a public K-12 education regardless of status", "Only for newcomers"], "a": 2}, {"q": "To ask a parent to have a seat, say:", "opts": ["Siéntate, por favor.", "Siéntense, por favor.", "Siéntese, por favor.", "Sentarse, por favor."], "a": 2}], "cheat": [{"title": "Good-news call", "kind": "phrases", "wide": true, "rows": [["Buenas tardes. ¿Hablo con la mamá / el papá de ___?", "Good afternoon. Am I speaking with ___'s mom / dad?", "AH-bloh kohn lah mah-MAH / ehl pah-PAH"], ["Habla la maestra / el maestro ___.", "This is ___ (the teacher).", "AH-blah lah mah-EHS-trah / ehl mah-EHS-troh"], ["Todo está bien. Le llamo con buenas noticias.", "Everything is fine. I'm calling with good news.", "TOH-doh ehs-TAH BYEHN. leh YAH-moh kohn BWEH-nahs noh-TEE-syahs"], ["Su hijo / Su hija trabajó mucho hoy.", "Your son / daughter worked hard today.", "soo EE-hoh / EE-hah trah-bah-HOH MOO-choh OY"], ["Gracias por su apoyo. Que tenga un buen día.", "Thanks for your support. Have a good day.", "GRAH-syahs pohr soo ah-POH-yoh"]]}, {"title": "Conference", "kind": "pairs", "rows": [["Bienvenidos. Pase, por favor.", "Welcome. Come in."], ["Siéntese, por favor.", "Have a seat."], ["Un intérprete nos va a ayudar.", "An interpreter will help us."], ["¿Tiene preguntas?", "Any questions?"]]}, {"title": "Interpreter phrases", "kind": "pairs", "rows": [["¿Qué idioma prefiere?", "Preferred language?"], ["¿Quiere un intérprete?", "Want an interpreter?"], ["Le vuelvo a llamar con un intérprete.", "I'll call back with an interpreter."], ["Gracias, pero vamos a usar un intérprete.", "Thanks, but we'll use an interpreter."]]}, {"title": "Interpreter required", "kind": "bullets", "rows": ["Grades, failing, retention", "Discipline or suspension", "Special education, IEP, 504", "Health, safety, counseling", "Legal or custody matters"]}, {"title": "Two rules, no exceptions", "kind": "bullets", "alert": true, "rows": ["Never use students or siblings as interpreters.", "Never ask about immigration status (Plyler v. Doe, 1982)."]}]}], "final_assessment": {"intro": "This performance task brings the six modules together. Work with a partner who plays the student or family member and, if possible, a third colleague who observes and uses the rubric. Each station takes about five minutes. You may use your cheat sheets to prepare, but try to perform without them.", "stations": [{"name": "Station A: The first day", "modules": "Modules 1, 2, and 3", "tasks": ["Greet a new student at the door with the right greeting for the time of day.", "Learn the student's full name, which has two surnames. Use Ask, Listen, Repeat, Check, Use, and tell your observer which surname you would file under.", "Give three directions to the whole class (ustedes) and one to the new student (tú), with gestures."]}, {"name": "Station B: During the lesson", "modules": "Modules 4 and 5", "tasks": ["Preview a lesson: say \"Hoy vamos a aprender sobre ___\" and introduce three cognates from your subject.", "Run a short Talk Then Write with a bilingual sentence frame.", "Check the student's understanding without saying \"¿Entiendes?\", then give specific praise."]}, {"name": "Station C: Reaching the family", "modules": "Module 6", "tasks": ["Make a good-news call or leave a voicemail using usted.", "Your partner, as the parent, raises a serious concern, such as a failing grade or a behavior issue. Respond politely in Spanish and arrange a qualified interpreter.", "Your partner, as the student, offers to interpret. Decline kindly in Spanish."]}], "rubric_note": "Your observer circles one level per row after all three stations. Use the results to choose what to practice next. Judgment matters most: aim for Confident (3) in that row before you communicate with families on your own.", "rubric_cols": ["Criteria", "Getting started (1)", "Developing (2)", "Confident (3)"], "rubric": [["Pronunciation", "Vowels glide; stress often misplaced; names hard to recognize.", "Mostly pure vowels; stress usually correct; names recognizable.", "Pure vowels, correct stress, and names said the way the student says them."], ["Accurate forms", "Mixes tú, ustedes, and usted.", "Usually chooses the right form, with some slips.", "Consistently uses tú with one student, ustedes with groups, and usted with adults."], ["Respect and warmth", "Greets without names or titles.", "Uses names and titles most of the time.", "Uses names, titles, greetings, and a warm tone throughout."], ["Judgment", "Tries to handle a serious matter alone, or uses a student to interpret.", "Recognizes the need for an interpreter after a prompt.", "Moves to a qualified interpreter without a prompt and declines student interpreting kindly."], ["Support for learning", "Translates everything or uses no strategy.", "Uses one strategy: cognates, a frame, or a check for understanding.", "Combines a preview, cognates, a frame, and a strong check for understanding."]], "reflection": ["Which phrase felt most natural? Which one will you practice this week?", "Which student will you greet by name, correctly, tomorrow?", "Which family will get a good-news call from you in the next two weeks?"]}, "glossary": [["acento / tilde", "The written accent mark ( ´ ). It shows the stressed syllable and is part of correct spelling."], ["apellido", "Surname. Many Spanish speakers have two: the first usually from the father, the second from the mother."], ["cheat sheet", "The one-page summary at the end of each module, designed to keep on your desk."], ["cognado (cognate)", "A word that looks, sounds, and means the same in two languages, such as ecuación and equation."], ["command", "A direction, such as Siéntate (to one student) or Siéntense (to the whole class)."], ["compañero / compañera", "Classmate or partner."], ["ENL", "English as a New Language: instruction that supports students who are learning English."], ["English learner (EL)", "A student who is developing proficiency in English while learning grade-level content."], ["falso cognado (false cognate)", "A look-alike word with a different meaning, such as embarazada, which means pregnant, not embarrassed."], ["funds of knowledge", "The knowledge, skills, and practices found in students' households and communities, which teachers can learn from and build on (Moll et al., 1992)."], ["intérprete (interpreter)", "A trained person who conveys spoken messages between languages. A translator works with written text."], ["marco de oración (sentence frame)", "A partial sentence that supports academic talk or writing, such as Creo que ___ porque ___."], ["palabras clave", "Key words."], ["Plyler v. Doe (1982)", "The U.S. Supreme Court case holding that public schools may not deny children a K-12 education based on immigration status."], ["Preview-View-Review", "A lesson routine: preview key ideas in the home language, teach the lesson in English, and review in the home language or both."], ["pronunciation respelling", "The English-style spelling in this workbook that shows how to say a Spanish word, with the stressed syllable in capital letters."], ["qualified interpreter", "An interpreter trained for school settings and bound by confidentiality. Never a student, a sibling, or an untrained volunteer."], ["quiet period", "A stage in which many new language learners listen far more than they speak."], ["señor, señora, señorita", "Mr., Mrs. or Ms., and Miss. Used with or without a last name."], ["Talk Then Write", "A routine in which students think and talk, in any language, before writing in English."], ["translanguaging", "Students' use of their full language repertoire to learn and communicate, and teaching that plans for it (García, Johnson, & Seltzer, 2017)."], ["tú", "The familiar singular \"you.\" Use it with one student."], ["usted", "The respectful singular \"you.\" Use it with one adult, such as a parent or colleague."], ["ustedes", "The plural \"you\" in Latin America. Use it with any group, including the whole class."]], "references": ["Cummins, J. (2001). Negotiating identities: Education for empowerment in a diverse society (2nd ed.). California Association for Bilingual Education.", "García, O., Johnson, S. I., & Seltzer, K. (2017). The translanguaging classroom: Leveraging student bilingualism for learning. Caslon.", "Moll, L. C., Amanti, C., Neff, D., & González, N. (1992 const app=document.getElementById('app');
const KEY='sft-progress-v1';let P={};try{P=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){P={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}updBar()}
const STEPS=['lesson','phrases','practice','quiz','cheat'];
function mp(n){const s=P['m'+n]||{};let d=0;STEPS.forEach(k=>{if(s[k])d++});return Math.round(d/STEPS.length*100)}
function updBar(){let t=0;C.modules.forEach(m=>t+=mp(m.num));if(P.final)t+=100;const p=Math.round(t/(C.modules.length+1));document.getElementById('pbar').style.width=p+'%';document.getElementById('ppct').textContent=p+'%'}
function mark(n,k){P['m'+n]=P['m'+n]||{};if(!P['m'+n][k]){P['m'+n][k]=1;save();toast('Progress saved ✓')}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600)}
let voices=[],curU=null,unlocked=false,noEs=false;
function lv(){try{voices=('speechSynthesis' in window)?speechSynthesis.getVoices()||[]:[]}catch(e){voices=[]}}
lv();if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=lv;
function esVoice(){lv();const es=voices.filter(v=>/^es([-_]|$)/i.test(v.lang)||/spanish|español/i.test(v.name));
 const pref=['es-US','es-MX','es-419','es-ES'];for(const l of pref){const v=es.find(v=>v.lang.replace('_','-').toLowerCase()===l.toLowerCase()&&v.localService);if(v)return v}
 return es.find(v=>v.localService)||es[0]||null}
function unlock(){if(unlocked||!('speechSynthesis' in window))return;unlocked=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);speechSynthesis.resume()}catch(e){}}
document.addEventListener('touchend',unlock,{once:true,passive:true});document.addEventListener('click',unlock,{once:true});
function speak(t,btn,cb){if(!('speechSynthesis' in window)){toast('This browser has no speech audio. Read the say-it key.');return}
 unlock();try{speechSynthesis.cancel()}catch(e){}
 const txt=t.replace(/_+/g,' ').replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim();
 const fire=()=>{const u=new SpeechSynthesisUtterance(txt);curU=u;u.rate=.85;u.pitch=1;u.volume=1;
  const v=esVoice();if(v){u.voice=v;u.lang=v.lang}else{u.lang='es-US';if(!noEs&&voices.length){noEs=true;toast('No Spanish voice on this device: install one in Settings → Accessibility → Spoken Content / Text-to-speech')}}
  if(btn)btn.classList.add('on');let done=false;const end=()=>{if(done)return;done=true;if(btn)btn.classList.remove('on');if(cb)cb()};
  u.onend=end;u.onerror=e=>{if(e&&e.error==='interrupted')return;end()};
  speechSynthesis.speak(u);try{speechSynthesis.resume()}catch(e){}
  // iOS sometimes never fires onend; clear the button after a generous estimate
  setTimeout(end,Math.max(2500,txt.length*140))};
 if(!voices.length){lv();setTimeout(fire,voices.length?60:250)}else setTimeout(fire,60)}
function pb(t){return `<button class="play" aria-label="Play Spanish audio" data-say="${esc(t)}">🔊</button>`}
app.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)speak(b.dataset.say,b)});
function norm(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[¡!¿?.,;:"']/g,'').replace(/\s+/g,' ').trim()}
function setVars(m){const i=m.num-1;document.documentElement.style.setProperty('--mc',VIB[i]);document.documentElement.style.setProperty('--ml',VIBL[i])}
function resetVars(){document.documentElement.style.setProperty('--mc','#F26B5B');document.documentElement.style.setProperty('--ml','#FDECEA')}

function go(r){location.hash=r}
window.addEventListener('hashchange',route);
function route(){const h=location.hash.slice(1)||'home';if(window.speechSynthesis)speechSynthesis.cancel();window.scrollTo(0,0);
 let m;if(m=h.match(/^m(\d)(?:-(\w+))?$/))return renderModule(+m[1],m[2]||'lesson');
 if(h==='final')renderFinal();else if(h==='cert')renderCert();else if(h==='start')renderStart();else renderHome();window.scrollTo(0,0)}

 <div class="sec"><h2><span class="ic">🧭</span>Getting started</h2>${C.how_to_use.map(x=>`<div class="box"><h4>${esc(x[0])}</h4>${esc(x[1])}</div>`).join('')}</div>
 <div class="sec"><h2><span class="ic">🔤</span>Pronunciation key</h2><p>${esc(k.intro)}</p><div class="tblwrap"><table><tr><th>Respelling</th><th>Meaning</th><th>Example</th></tr>${k.rules.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</table></div><div class="box">${esc(k.note)}</div></div>
 <div class="sec"><h2><span class="ic">📚</span>Glossary</h2><div class="tblwrap"><table>${C.glossary.map(g=>`<tr><td><b>${esc(g[0])}</b></td><td>${esc(g[1])}</td></tr>`).join('')}</table></div>
 <h3>References</h3><ul>${C.references.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>
 <div class="nav2"><button class="btn o sm" onclick="go('home')">← Home</button><button class="btn c" onclick="go('m1')">Start Module 1 →</button></div>`}

const TABS=[['lesson','📖 Lesson'],['phrases','🎧 Phrases'],['practice','✏️ Practice'],['quiz','🏆 Quiz'],['cheat','📄 Cheat sheet']];
function renderModule(n,tab){const m=C.modules[n-1];if(!m)return renderHome();setVars(m);const s=P['m'+n]||{};
 let body='';
 if(tab==='lesson')body=lessonHTML(m);else if(tab==='phrases')body=phrasesHTML(m);else if(tab==='practice')body=practiceHTML(m);else if(tab==='quiz')body=quizHTML(m);else body=cheatHTML(m);
 const ti=TABS.findIndex(t=>t[0]===tab);const nxt=ti<4?`m${n}-${TABS[ti+1][0]}`:(n<6?`m${n+1}`:'final');const prv=ti>0?`m${n}-${TABS[ti-1][0]}`:(n>1?`m${n-1}-cheat`:'home');
 app.innerHTML=`<div class="mhero"><div class="emo">${EMO[n-1]}</div><div><div style="font-weight:800;letter-spacing:.1em;opacity:.9">MODULE ${n} OF 6</div><h1>${esc(m.title)}</h1><div class="es" style="font-size:20px">${esc(m.es)}</div></div><div class="ring" style="--p:${mp(n)};--c:#F2B33D;margin-left:auto"><b style="color:var(--navy)">${mp(n)}%</b></div></div>
 <nav class="tabs">${TABS.map(t=>`<button class="tab ${t[0]===tab?'on':''} ${s[t[0]]?'done':''}" onclick="go('m${n}-${t[0]}')">${t[1]}</button>`).join('')}</nav>
 ${body}<div class="nav2"><button class="btn o sm" onclick="go('${prv}')">← Back</button>${tab!=='quiz'?`<button class="btn c" id="nextbtn" onclick="mark(${n},'${tab}');go('${nxt}')">Mark done &amp; continue →</button>`:`<button class="btn c" onclick="go('${nxt}')">Continue →</button>`}</div>`;
 if(tab==='practice')wirePractice(m);if(tab==='quiz')wireQuiz(m);if(tab==='phrases'||tab==='cheat')mark(n,tab);window.scrollTo(0,0)}

function lessonHTML(m){let h=`<div class="sec"><h2><span class="ic">🎯</span>Learning goals</h2>${m.goals.map(g=>`<div class="goal">${esc(g)}</div>`).join('')}</div><div class="sec"><h2><span class="ic">📖</span>Mini-lesson</h2><p><b>${esc(m.overview)}</b></p>`;
 m.lesson.forEach(b=>{const[t,v,w]=b;if(t==='h')h+=`<h3 style="color:var(--mc);font-size:24px">${esc(v)}</h3>`;else if(t==='p')h+=`<p>${esc(v)}</p>`;
 else if(t==='ul'||t==='ol')h+=`<${t}>${v.map(x=>`<li>${esc(x)}</li>`).join('')}</${t}>`;else if(t==='box')h+=`<div class="box"><h4>💡 ${esc(v)}</h4><ul>${w.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
 else if(t==='table')h+=`<div class="tblwrap"><table><tr>${v.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${v.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`});
 h+=`</div><div class="sec"><h2><span class="ic">🌎</span>${esc(m.tip.title)}</h2>${m.tip.paras.map(p=>`<p>${esc(p)}</p>`).join('')}</div>`;return h}
function phrasesHTML(m){return `<div class="sec"><h2><span class="ic">🎧</span>Phrases to know</h2><p>Tap 🔊 to hear each phrase. Say it back out loud two times.</p><p class="noprint" style="font-size:14px;color:#666">📱 On a phone: turn the ringer/silent switch off and the media volume up. Audio uses your device's built-in Spanish voice. <button class="btn o sm" data-say="Hola, maestros. ¿Me escuchan bien?">🔊 Test audio</button></p><button class="btn sm noprint" id="playall">▶ Play all</button>
 ${m.phrases.map(p=>`<div class="ph">${pb(p[1])}<div><div class="sp">${esc(p[1])}</div><div class="pr">${esc(p[2])}</div><div class="en">${esc(p[0])}</div></div></div>`).join('')}</div>`}
app.addEventListener('click',e=>{if(e.target.id==='playall'){const bs=[...app.querySelectorAll('.ph [data-say]')];let i=0;const btn=e.target;if(btn.dataset.run){btn.dataset.run='';speechSynthesis.cancel();btn.textContent='▶ Play all';return}btn.dataset.run='1';btn.textContent='■ Stop';const nx=()=>{if(!btn.dataset.run||i>=bs.length){btn.dataset.run='';btn.textContent='▶ Play all';return}const b=bs[i++];b.scrollIntoView({block:'center',behavior:'smooth'});speak(b.dataset.say,b,()=>setTimeout(nx,500))};nx()}});

function ansList(a){return `<button class="btn o sm rv" style="margin-top:10px">👀 Show answers</button><div class="ans"><b>Answer key</b><ul>${a.answers.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`}
function practiceHTML(m){return `<div class="sec"><h2><span class="ic">✏️</span>Practice</h2>${m.activities.map((a,i)=>{let h=`<div class="act" data-i="${i}"><span class="tag">${esc(a.type.toUpperCase())}</span><h3>${esc(a.title)}</h3><p class="instr">${esc(a.instr)}</p>`;
 if(a.kind==='match'){const L='abcdefghij';h=h.replace(esc(a.instr),'Choose the matching answer for each item, then press Check.');
  h+=a.left.map((l,j)=>`<div class="mrow"><span class="l">${esc(l)}</span><select data-j="${j}"><option value="">Choose…</option>${a.right.map((r,k)=>`<option value="${L[k]}">${esc(r)}</option>`).join('')}</select></div>`).join('')+`<button class="btn c sm chk">Check</button><div class="fb"></div>`+ansList(a)}
 else if(a.kind==='fill'&&fillAuto(a)){h=h.replace(esc(a.instr),esc(a.instr)+' Type your answer and press Check. Accent marks are not required to count, but try to include them.');
  h+=a.items.map((it,j)=>{const parts=it.split(/_{3,}/);return `<div class="mrow"><span>${j+1}. ${esc(parts[0])}<input type="text" data-j="${j}" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:170px">${esc(parts.slice(1).join(''))}</span></div>`}).join('')+`<button class="btn c sm chk">Check</button><div class="fb"></div>`+ansList(a)}
 else if(a.kind==='order'){const it=a.items.map(x=>x.replace(/^_+\s*/,''));const sh=it.map((x,k)=>k);h=h.replace(esc(a.instr),'Use the arrows to put the lines in order, then press Check.');
  h+=`<div class="olist">${sh.map(k=>`<div class="ord" data-k="${k}"><span>${esc(it[k])}</span><button class="up" aria-label="Move up">▲</button><button class="dn" aria-label="Move down">▼</button></div>`).join('')}</div><button class="btn c sm chk">Check</button><div class="fb"></div>`+ansList(a)}
 else if(a.kind==='roleplay'){h+=`<div class="script">${a.script.map((s,k)=>`<div class="bub ${/student|parent|interpreter/i.test(s[0])?'r':''}">${/[áéíóúñ¿¡]|\b(hola|gracias|bien|por favor|buenos|buenas|sí)\b/i.test(s[1])?pb(s[1]):''}<div><b>${esc(s[0])}</b>${esc(s[1])}</div></div>`).join('')}</div><h4>Self-check ✅</h4><div class="chk">${a.checklist.map(c=>`<label><input type="checkbox"> ${esc(c)}</label>`).join('')}</div>`+ansList(a)}
 else if(a.kind==='speak'){h+=a.items.map(x=>`<div class="ph">${pb(x)}<div><div class="sp" style="font-size:18px">${esc(x)}</div></div></div>`).join('')+ansList(a)}
 else{h+=`<ol>${a.items.map(x=>`<li style="margin:8px 0">${esc(x)}<br><textarea rows="2" style="width:100%;font:inherit;border:3px solid #ddd;border-radius:12px;padding:6px;margin-top:4px" placeholder="Your response…"></textarea></li>`).join('')}</ol>`+ansList(a)}
 return h+'</div>'}).join('')}</div>`}
function fillAuto(a){return a.answers.every(x=>/^\d+\.\s*[^:]+$/.test(x))&&a.items.every(x=>/_{3,}/.test(x))}
function fillAns(x){return x.replace(/^\d+\.\s*/,'').trim()}
function wirePractice(m){app.querySelectorAll('.act').forEach(el=>{const a=m.activities[+el.dataset.i];const fb=el.querySelector('.fb');
 el.querySelector('.rv').onclick=e=>{el.querySelector('.ans').classList.toggle('show');e.target.textContent=el.querySelector('.ans').classList.contains('show')?'🙈 Hide answers':'👀 Show answers'};
 el.querySelectorAll('.up,.dn').forEach(b=>b.onclick=()=>{const r=b.parentElement;if(b.classList.contains('up')&&r.previousElementSibling)r.parentElement.insertBefore(r,r.previousElementSibling);else if(b.classList.contains('dn')&&r.nextElementSibling)r.parentElement.insertBefore(r.nextElementSibling,r)});
 const c=el.querySelector('.chk');if(!c)return;c.onclick=()=>{let ok=0,tot=0,acc=0;
  if(a.kind==='match'){el.querySelectorAll('select').forEach((s,j)=>{tot++;const want=(a.answers[j].match(/^\d+\.\s*([a-j])/)||[])[1];s.classList.remove('ok','bad');if(s.value===want){ok++;s.classList.add('ok')}else s.classList.add('bad')})}
  else if(a.kind==='fill'){el.querySelectorAll('input').forEach((s,j)=>{tot++;const want=fillAns(a.answers[j]);s.classList.remove('ok','bad');const pre=(a.items[j].split(/_{3,}/)[0].match(/(\S*)$/)||['',''])[1];if(norm(s.value)===norm(want)||(pre&&norm(pre+s.value)===norm(want))){ok++;s.classList.add('ok');const got=(pre&&norm(pre+s.value)===norm(want)?pre+s.value:s.value).trim().toLowerCase().replace(/[.!¡¿?]/g,'');if(got!==want.toLowerCase().replace(/[.!¡¿?]/g,''))acc++}else s.classList.add('bad')})}
  else if(a.kind==='order'){const want={};a.answers.forEach(x=>{const mm=x.match(/^(.*?)\s*=\s*(\d+)$/);if(mm)want[mm[1].replace(/\.\.\.$/,'').trim()]=+mm[2]});
   const it=a.items.map(x=>x.replace(/^_+\s*/,''));const pos=k=>{for(const key in want)if(it[k].startsWith(key))return want[key];return 0};
   el.querySelectorAll('.ord').forEach((r,j)=>{tot++;const good=pos(+r.dataset.k)===j+1;r.style.outline=good?'3px solid #3FA34D':'3px solid #E35D4F';if(good)ok++})}
  fb.className='fb '+(ok===tot?'g':'r');fb.textContent=ok===tot?`🎉 ¡Excelente! ${ok} of ${tot} correct.`+(acc?` Hint: add the accent marks on ${acc} answer${acc>1?'s':''} (see the answer key).`:''):`${ok} of ${tot} correct. Red ones need another try. ¡Tú puedes!`;
  if(ok===tot&&tot)burst(70)}})}

function quizHTML(m){return `<div class="sec"><h2><span class="ic">🏆</span>Module ${m.num} Quiz</h2><p>Five questions. Pick one answer for each, then press Submit. Score 80% or higher to celebrate! 🎊</p><div id="qz">${m.quiz.map((q,i)=>`<div class="q" data-i="${i}"><h4>${i+1}. ${esc(q.q)}</h4>${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${'ABCD'[k]}. ${esc(o)}</button>`).join('')}<div class="fb"></div></div>`).join('')}</div>
 <button class="btn c" id="submitq">Submit quiz</button><div id="qres"></div></div>`}
function wireQuiz(m){const sel={};app.querySelectorAll('.q').forEach(q=>q.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(q.dataset.locked)return;q.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel[q.dataset.i]=+b.dataset.k}));
 document.getElementById('submitq').onclick=()=>{if(Object.keys(sel).length<m.quiz.length){toast('Answer all 5 questions first');return}let sc=0;
  app.querySelectorAll('.q').forEach(q=>{const i=+q.dataset.i,qq=m.quiz[i];q.dataset.locked=1;const opts=q.querySelectorAll('.opt');opts[qq.a].classList.add('right');const fb=q.querySelector('.fb');
   if(sel[i]===qq.a){sc++;fb.className='fb g';fb.textContent='✅ Correct!'}else{opts[sel[i]].classList.add('wrong');fb.className='fb r';fb.textContent='❌ Not quite. The correct answer is '+'ABCD'[qq.a]+'.'}});
  const pct=Math.round(sc/m.quiz.length*100);P['m'+m.num]=P['m'+m.num]||{};P['m'+m.num].quiz=1;P['m'+m.num].best=Math.max(P['m'+m.num].best||0,pct);save();
  document.getElementById('submitq').style.display='none';
  document.getElementById('qres').innerHTML=`<div class="score"><div class="big">${pct}%</div><h2 style="color:#fff">${pct>=80?'¡Fantástico! 🎉 You got '+sc+' of 5.':'¡Buen intento! You got '+sc+' of 5. Review and try again.'}</h2><p>Best score: ${P['m'+m.num].best}%</p><button class="btn" id="retake">↻ Retake quiz</button></div>`;
  document.getElementById('retake').onclick=()=>renderModule(m.num,'quiz');document.getElementById('qres').scrollIntoView({behavior:'smooth',block:'center'});
  if(pct>=80)burst(220)}}

function cheatHTML(m){return `<div class="sec"><h2><span class="ic">📄</span>Cheat sheet</h2><p>Keep this on your desk. <button class="btn sm noprint" onclick="window.print()">🖨️ Print</button></p><div class="cgrid">${m.cheat.map(c=>{let b='';
 if(c.kind==='pairs')b=`<table>${c.rows.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td></tr>`).join('')}</table>`;
 else if(c.kind==='bullets')b=`<ul>${c.rows.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`;
 else if(c.kind==='phrases')b=c.rows.map(r=>`<div class="ph" style="background:#fff">${pb(r[0])}<div><div class="sp" style="font-size:17px">${esc(r[0])}</div><div class="pr">${esc(r[2])}</div><div class="en">${esc(r[1])}</div></div></div>`).join('');
 else if(c.kind==='commands')b=`<div class="tblwrap"><table><tr><th>English</th><th>One student (tú)</th><th>Whole class (ustedes)</th></tr>${c.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${pb(r[1])} ${esc(r[1])}</td><td>${pb(r[2])} ${esc(r[2])}</td></tr>`).join('')}</table></div>`;
 return `<div class="cc ${c.wide?'wide':''}"><h4>${esc(c.title)}</h4>${b}</div>`}).join('')}</div></div>`}

function renderFinal(){resetVars();const f=C.final_assessment;
 app.innerHTML=`<div class="mhero" style="background:linear-gradient(120deg,#1F2A44,#F26B5B)"><div class="emo">🎭</div><div><div style="font-weight:800;letter-spacing:.1em">FINAL ASSESSMENT</div><h1>Role-Play Stations</h1><div class="es">La prueba final</div></div></div>
 <div class="sec"><p>${esc(f.intro)}</p></div>
 <div class="grid" style="margin-top:0">${f.stations.map((s,i)=>`<div class="sec" style="border-top:10px solid ${['#F2545B','#12A4B5','#8E5CE6'][i]}"><h3 style="color:var(--navy)">${esc(s.name)}</h3><span class="tag" style="background:#F2B33D;border-radius:99px;padding:2px 12px;font-weight:800;font-size:13px">${esc(s.modules)}</span><div class="chk" style="margin-top:10px">${s.tasks.map(t=>`<label><input type="checkbox"> ${esc(t)}</label>`).join('')}</div></div>`).join('')}</div>
 <div class="sec"><h2><span class="ic">📊</span>Rubric</h2><p>${esc(f.rubric_note)}</p><div class="tblwrap"><table><tr>${f.rubric_cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${f.rubric.map((r,ri)=>`<tr><td><b>${esc(r[0])}</b></td>${r.slice(1).map((c,ci)=>`<td><label style="display:flex;gap:6px;cursor:pointer"><input type="radio" name="rb${ri}" style="accent-color:#F26B5B"> ${esc(c)}</label></td>`).join('')}</tr>`).join('')}</table></div></div>
 <div class="sec"><h2><span class="ic">💭</span>Reflection</h2>${f.reflection.map(r=>`<p><b>${esc(r)}</b><br><textarea rows="2" style="width:100%;font:inherit;border:3px solid #ddd;border-radius:12px;padding:6px"></textarea></p>`).join('')}</div>
 <div class="nav2"><button class="btn o sm" onclick="go('m6-cheat')">← Module 6</button><button class="btn c" onclick="P.final=1;save();go('cert')">🎓 Complete and get my certificate →</button></div>`}
function renderCert(){resetVars();const nm=P.name||'';const d=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
 app.innerHTML=`<div class="sec noprint"><h2><span class="ic">🎓</span>Your certificate</h2><p>Type your name as you want it to appear, then print or save as PDF.</p><div class="mrow"><input type="text" id="nmin" value="${esc(nm)}" placeholder="Your full name" style="flex:1;min-width:200px"><button class="btn c" onclick="window.print()">🖨️ Print certificate</button></div></div>
 <div class="cert"><img src="${LOGO}" alt="EL Publishing logo"><div style="letter-spacing:.2em;color:#F26B5B;font-weight:800">EL PUBLISHING</div><h1>Certificate of Completion</h1><p>This certifies that</p><div class="nm" id="nmout">${esc(nm)||'&nbsp;'}</div>
 <p style="font-size:20px">has completed <b>Spanish for Teachers: A 6-Module Course</b></p><p>${d}</p><div style="margin-top:30px;font-weight:800;color:var(--navy)">Richard A. Daniel</div><div>Author, 25-year Spanish teacher · EL Publishing</div></div>`;
 document.getElementById('nmin').oninput=e=>{P.name=e.target.value;try{localStorage.setItem(KEY,JSON.stringify(P))}catch(_){};document.getElementById('nmout').innerHTML=esc(e.target.value)||'&nbsp;'};if(P.final)burst(150)}

const cv=document.getElementById('confetti'),cx=cv.getContext('2d');let parts=[],anim=0;
function burst(n){cv.width=innerWidth;cv.height=innerHeight;const cols=['#F26B5B','#F2B33D','#1F2A44','#12A4B5','#2EB872','#8E5CE6','#F2545B'];
 for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.4,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,s:6+Math.random()*8,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,l:0});if(!anim)tick()}
function tick(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;p.l++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);cx.restore()});
 parts=parts.filter(p=>p.y<cv.height+40&&p.l<400);if(parts.length)anim=requestAnimationFrame(tick);else{anim=0;cx.clearRect(0,0,cv.width,cv.height)}}
updBar();route();
</script></body></html>
