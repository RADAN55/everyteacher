<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Spanish for Teachers: a free six-module interactive course for K-12 teachers of any subject who teach Spanish-speaking English learners. Audio phrases, self-checking practice, quizzes, cheat sheets, a printable workbook and a certificate. By Richard A. Daniel, EL Publishing.">
<title>Spanish for Teachers: Interactive Course | EL Publishing</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1F2A44;--coral:#F26B5B;--gold:#F2B33D;--bg:#FFF8F0;--mc:#F26B5B;--ml:#FDECEA}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Baloo 2","Poppins","Nunito","Segoe UI Rounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;background:var(--bg);color:#22293a;font-size:17px;line-height:1.55}
h1,h2,h3,h4{font-family:"Baloo 2","Poppins","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;line-height:1.15;margin:.3em 0}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.top img{width:40px;height:40px;border-radius:50%;background:#fff}
.top .brand{font-weight:800;font-size:18px;cursor:pointer}.top .brand small{display:block;font-weight:600;color:var(--gold);font-size:12px;letter-spacing:.06em}
.top .bar{flex:1;max-width:340px;margin-left:auto;height:14px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
.top .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#E35D4F,#F2B33D,#3F8F5F,#2B8A9A,#7A5C9E);border-radius:99px;transition:width .6s}
.top .pct{font-weight:800;color:var(--gold);min-width:44px;text-align:right}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.hero{background:linear-gradient(120deg,#1F2A44 0%,#5B3A5E 45%,#F26B5B 100%);color:#fff;border-radius:28px;padding:38px 32px;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(31,42,68,.3)}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(var(--gold),transparent 70%);opacity:.45}
.hero .row{display:flex;gap:26px;align-items:center;position:relative;z-index:1}
.hero img{width:130px;height:130px;border-radius:50%;background:#fff;border:5px solid var(--gold);flex:none;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.hero h1{font-size:clamp(32px,6vw,56px);margin:0}.hero .sub{font-size:clamp(18px,3vw,24px);color:var(--gold);font-weight:800}
.hero .by{margin-top:8px;opacity:.95}.hero .by b{color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.chip{background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.35);padding:4px 14px;border-radius:99px;font-weight:700;font-size:15px}
.btn{border:0;border-radius:99px;padding:11px 22px;font-weight:800;background:var(--gold);color:var(--navy);box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 rgba(0,0,0,.18)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.c{background:var(--mc);color:#fff}.btn.o{background:#fff;color:var(--navy);border:3px solid var(--mc);box-shadow:none}
.btn.sm{padding:6px 14px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:24px}
.mcard{background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.08);cursor:pointer;transition:transform .2s,box-shadow .2s;border:0;text-align:left;padding:0;display:flex;flex-direction:column}
.mcard:hover{transform:translateY(-6px) rotate(-.5deg);box-shadow:0 18px 34px rgba(0,0,0,.15)}
.mcard .head{background:var(--c);color:#fff;padding:20px;display:flex;align-items:center;gap:14px;position:relative}
.mcard .emo{font-size:44px;background:rgba(255,255,255,.22);width:72px;height:72px;border-radius:22px;display:grid;place-items:center;transition:transform .3s}
.mcard:hover .emo{transform:scale(1.12) rotate(8deg)}
.mcard .num{font-weight:800;font-size:14px;letter-spacing:.1em;opacity:.9}.mcard h3{font-size:24px;margin:0}
.mcard .body{padding:16px 20px 20px;flex:1;display:flex;gap:14px;align-items:center}
.mcard .body p{margin:0;flex:1;font-size:15px}.es{font-style:italic;color:var(--c,var(--mc));font-weight:700}
.ring{--p:0;width:64px;height:64px;border-radius:50%;flex:none;background:conic-gradient(var(--c) calc(var(--p)*1%),#eee 0);display:grid;place-items:center}
.ring b{background:#fff;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:14px}
.sec{background:#fff;border-radius:24px;padding:24px;margin-top:20px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.sec>h2{display:flex;align-items:center;gap:10px;color:var(--navy);font-size:28px}
.sec>h2 .ic{background:var(--ml);width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:26px}
.mhero{background:linear-gradient(120deg,var(--mc),#1F2A44 140%);color:#fff;border-radius:28px;padding:28px;display:flex;gap:20px;align-items:center;box-shadow:0 12px 28px rgba(0,0,0,.18)}
.mhero .emo{font-size:64px;animation:bob 4s infinite}.mhero h1{font-size:clamp(28px,5vw,46px);margin:0}.mhero .es{color:var(--gold)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0;position:sticky;top:56px;z-index:40;background:var(--bg);padding:8px 0}
.tab{border:3px solid var(--mc);background:#fff;color:var(--navy);border-radius:99px;padding:6px 16px;font-weight:800;transition:all .15s}
.tab:hover{transform:translateY(-2px)}.tab.on{background:var(--mc);color:#fff}.tab.done:after{content:" ✓"}
table{border-collapse:separate;border-spacing:0;width:100%;border-radius:16px;overflow:hidden;margin:12px 0}
th{background:var(--mc);color:#fff;text-align:left;padding:10px 12px}td{padding:10px 12px;border-bottom:1px solid #f0e6e0;vertical-align:top}
tr:nth-child(even) td{background:var(--ml)}
.tblwrap{overflow-x:auto}
.play{border:0;background:var(--mc);color:#fff;width:42px;height:42px;border-radius:50%;font-size:18px;transition:transform .15s;flex:none}
.play:hover{transform:scale(1.15)}.play.on{animation:pulse .8s infinite}@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(242,179,61,.4)}}
.ph{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--ml);margin:8px 0;transition:transform .15s}
.ph:hover{transform:translateX(4px)}.ph .sp{font-weight:800;font-size:20px;color:var(--navy)}.ph .pr{color:var(--mc);font-weight:700;font-size:15px}.ph .en{color:#555;font-size:15px}
.ph>div{flex:1}
.box{border-left:8px solid var(--gold);background:#FFF6E0;border-radius:16px;padding:14px 18px;margin:14px 0}.box h4{margin:0 0 6px;color:var(--navy)}
.goal{display:flex;gap:10px;margin:6px 0}.goal:before{content:"⭐"}
.act{border:3px solid var(--ml);border-radius:22px;padding:18px;margin:16px 0}
.act .tag{display:inline-block;background:var(--mc);color:#fff;border-radius:99px;padding:2px 12px;font-size:13px;font-weight:800;letter-spacing:.05em}
.act h3{color:var(--navy)}.instr{color:#444}
.mrow{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}.mrow .l{font-weight:800;font-size:20px;min-width:110px;background:var(--ml);border-radius:12px;padding:6px 12px}
select,input[type=text]{font:inherit;border:3px solid #ddd;border-radius:12px;padding:6px 10px;background:#fff;max-width:100%}
select:focus,input:focus{outline:none;border-color:var(--gold)}
.ok{border-color:#3FA34D!important;background:#E9F8EC!important}.bad{border-color:#E35D4F!important;background:#FDECEA!important}
.fb{font-weight:800;margin-top:10px;min-height:1.4em}.fb.g{color:#2E8540}.fb.r{color:#C0392B}
.ans{display:none;background:#F0F7FF;border-radius:14px;padding:12px 16px;margin-top:10px}.ans.show{display:block;animation:pop .3s}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.ord{display:flex;gap:8px;align-items:center;background:var(--ml);border-radius:14px;padding:8px 10px;margin:6px 0}.ord span{flex:1;font-weight:700}
.ord button{border:0;background:#fff;border-radius:10px;width:36px;height:36px;font-size:16px}
.script{display:flex;flex-direction:column;gap:8px;margin:10px 0}.bub{max-width:85%;padding:10px 14px;border-radius:18px;background:var(--ml);display:flex;gap:8px;align-items:center}
.bub.r{align-self:flex-end;background:#E8F0FF}.bub b{display:block;font-size:13px;color:var(--mc)}.bub .play{width:34px;height:34px;font-size:14px}
.chk label{display:flex;gap:8px;align-items:center;margin:4px 0;cursor:pointer}.chk input{width:20px;height:20px;accent-color:var(--mc)}
.q{border-radius:20px;background:var(--ml);padding:16px;margin:12px 0}.q h4{font-size:19px}
.opt{display:block;width:100%;text-align:left;border:3px solid #fff;background:#fff;border-radius:14px;padding:10px 14px;margin:6px 0;font-weight:600;transition:transform .12s}
.opt:hover{transform:translateX(6px);border-color:var(--gold)}.opt.sel{border-color:var(--navy)}.opt.right{border-color:#3FA34D;background:#E9F8EC}.opt.wrong{border-color:#E35D4F;background:#FDECEA}
.score{text-align:center;border-radius:24px;padding:24px;color:#fff;background:linear-gradient(120deg,var(--mc),var(--navy));margin-top:14px}.score .big{font-size:60px;font-weight:800;color:var(--gold)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.cc{background:var(--ml);border-radius:20px;padding:14px 16px;border-top:8px solid var(--mc)}.cc.wide{grid-column:1/-1}.cc h4{color:var(--navy);margin-top:0}
.cc ul{margin:0;padding-left:20px}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.cert{background:#fff;border:14px solid var(--navy);outline:6px solid var(--gold);outline-offset:-26px;border-radius:12px;padding:50px 40px;text-align:center;margin-top:20px}
.cert img{width:110px}.cert h1{color:var(--navy);font-size:40px}.cert .nm{font-size:44px;color:var(--coral);font-weight:800;border-bottom:3px solid var(--gold);display:inline-block;padding:0 30px;min-width:60%}
footer{text-align:center;color:#777;font-size:14px;padding:20px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:999}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 20px;border-radius:99px;font-weight:700;z-index:998;opacity:0;transition:opacity .3s}.toast.on{opacity:1}
@media (max-width:640px){body{font-size:16px}.hero{padding:26px 20px}.hero .row{flex-direction:column;text-align:center}.hero img{width:100px;height:100px}.chips{justify-content:center}
.top .brand small{display:none}.top .bar{max-width:120px}.mhero{flex-direction:column;text-align:center;padding:22px}.sec{padding:16px}.tabs{top:56px;overflow-x:auto;flex-wrap:nowrap}.tab{white-space:nowrap}.mrow .l{min-width:70px}.cert{padding:30px 14px}.cert .nm{font-size:30px}}
@media print{.top,.tabs,.nav2,.noprint,footer,#confetti{display:none!important}body{background:#fff}.cert{margin:0;page-break-inside:avoid}}
</style></head><body>

<script>
const C={"title": "Spanish for Teachers", "subtitle": "A 6-Module Course", "author": "Richard A. Daniel", "publisher": "EL Publishing", "how_to_use": [["Who this is for", "K-12 teachers of math, science, social studies, ELA, the arts, physical education, and every other subject who have little or no Spanish and who teach Spanish-speaking English learners."], ["What it is not", "This course will not make you fluent, and it does not replace a qualified interpreter. It gives you respectful, accurate phrases for everyday classroom moments and clear guidance on when to bring in help."], ["How each module works", "Every module follows the same path: learning goals, a short mini-lesson, a phrase table with pronunciation, a cultural and teaching tip, practice activities, a five-question quiz, and a one-page cheat sheet you can keep on your desk."], ["Study alone or with colleagues", "The partner role-plays work best with a colleague, a PLC, or a department. If you study alone, do the role-plays out loud and record yourself on your phone."], ["Use the answer key", "Answers to every activity and quiz are in the back of the workbook. Try each activity first, then check."], ["Time", "Plan about 45 to 60 minutes per module, plus a few minutes a day of speaking practice."]], "pronunciation_key": {"intro": "Every Spanish phrase in this workbook has a teacher-friendly respelling. Read the respelling like English, using these rules:", "rules": [["CAPITAL letters", "Stress this syllable.", "GRAH-syahs (gracias)"], ["ah, eh, ee, oh, oo", "The five Spanish vowels. Keep them short and pure.", "KAH-sah (casa)"], ["h", "A breathy h, as in hat. Used for Spanish j and for g before e or i.", "hoh-SEH (José)"], ["y", "As in yes. Used for Spanish ll and y.", "YAH-moh (llamo)"], ["ny", "As in canyon. Used for Spanish ñ.", "mah-NYAH-nah (mañana)"], ["r", "A quick tap, like the tt in butter.", "PEH-rah (pera)"], ["rr", "A rolled or trilled r.", "PEH-rroh (perro)"], ["b", "Spanish b and v sound almost the same.", "fah-BOHR (favor)"]], "note": "Spanish varies from country to country, just as English does. The respellings follow common Latin American pronunciation. When a student or family says something differently, follow their lead."}, "modules": [{"num": 1, "title": "Sounds and Names", "es": "Los sonidos y los nombres", "color": "#E35D4F", "light": "#FDECEA", "overview": "Spanish is spelled the way it sounds. Learn a small set of sound rules and you can read almost any Spanish name aloud, starting with the names on your roster.", "goals": ["Pronounce the five Spanish vowels clearly and consistently.", "Recognize the consonants that sound different from English: h, j, g, ll, y, ñ, r, rr, z, c, qu, v, and x.", "Use two simple stress rules and written accent marks to find the stressed syllable.", "Ask for, practice, and use a student's name with respect.", "Explain how two surnames (dos apellidos) work and use them correctly on rosters and with families."], "lesson": [["h", "Why start with sounds?"], ["p", "English spelling is full of surprises. Spanish spelling is not. Each letter, with a few predictable exceptions, has one sound. Once you know the patterns, you can read a new name or word aloud with confidence. Saying a student's name correctly on the first day tells the student, and the family, that they belong in your room."], ["h", "The five vowels"], ["p", "English vowels change sound from word to word. Spanish vowels do not. Each vowel has one short, clean sound. Keep it short and do not glide into a second sound: say \"oh,\" not \"oh-oo,\" and \"eh,\" not \"ay-ee.\""], ["table", {"cols": ["Letter", "Sound", "Like English", "Example"], "widths": [12, 14, 30, 44], "rows": [["a", "ah", "the a in father", "casa (KAH-sah) house"], ["e", "eh", "the e in met", "mesa (MEH-sah) table"], ["i", "ee", "the ee in see", "libro (LEE-broh) book"], ["o", "oh", "the o in no, but shorter", "ojo (OH-hoh) eye"], ["u", "oo", "the oo in moon", "luna (LOO-nah) moon"]]}], ["h", "Tricky consonants"], ["table", {"cols": ["Letter", "Sound", "Examples"], "widths": [24, 34, 42], "rows": [["h", "Always silent", "hola (OH-lah), Héctor (EHK-tohr)"], ["j, and g before e or i", "A breathy English h", "José (hoh-SEH), Gerardo (heh-RAHR-doh)"], ["g before a, o, u", "Hard g, as in go", "Gustavo (goos-TAH-boh)"], ["gue, gui", "Hard g; the u is silent", "Guillermo (gee-YEHR-moh)"], ["ll and y", "y, as in yes", "Yolanda (yoh-LAHN-dah), Castillo (kahs-TEE-yoh)"], ["ñ", "ny, as in canyon", "Peña (PEH-nyah), Muñoz (moo-NYOHS)"], ["r between vowels", "A quick tap, like the tt in butter", "Sara (SAH-rah), Mario (MAH-ryoh)"], ["rr, and r at the start of a word", "A rolled or trilled r", "Ramón (rrah-MOHN), Iturria (ee-TOO-rryah)"], ["z, and c before e or i", "s (in Latin America)", "Zapata (sah-PAH-tah), Cecilia (seh-SEE-lyah)"], ["qu", "k; the u is silent", "Joaquín (hwah-KEEN), Enrique (ehn-RREE-keh)"], ["v", "Almost the same as b", "Valeria (bah-LEH-ryah)"], ["x", "Usually ks; in some Mexican names, h", "Ximena (hee-MEH-nah), México (MEH-hee-koh)"]]}], ["p", "In much of Spain, z and c before e or i sound like the th in think. In Latin America they sound like s. Follow the way each student and family says their own name."], ["h", "Accent marks and stress"], ["p", "Every Spanish word has one stressed syllable. Three rules tell you where it is:"], ["ol", ["Rule 1. Words that end in a vowel, n, or s: stress the next-to-last syllable. Carmen (KAHR-mehn), Lucas (LOO-kahs), Rosa (RROH-sah).", "Rule 2. Words that end in any other consonant: stress the last syllable. Isabel (ee-sah-BEHL), Salvador (sahl-bah-DOHR).", "Rule 3. A written accent mark overrides Rules 1 and 2: stress the marked syllable. Martínez (mahr-TEE-nehs), Sofía (soh-FEE-ah), Andrés (ahn-DREHS)."]], ["box", "Accents are part of the spelling", ["Write the accent mark on rosters, name tags, labels, and certificates whenever the student or family uses it. José without the accent is a spelling mistake, not a style choice.", "An accent mark can change meaning: papa (potato) and papá (dad); si (if) and sí (yes).", "Spanish questions and exclamations open with an upside-down mark: ¿Cómo estás? ¡Muy bien!"]], ["h", "Learning a student's name: Ask, Listen, Repeat, Check, Use"], ["ol", ["Ask: \"¿Cómo se dice tu nombre?\" (How do you say your name?)", "Listen closely. Notice the vowels and which syllable is stressed.", "Repeat it back, slowly.", "Check: \"¿Lo digo bien?\" (Am I saying it right?) Try again until the student is satisfied.", "Use it every day, and write your own respelling in your roster so a substitute can say it too."]], ["p", "Do not shorten or anglicize a name unless the student asks you to. Some students choose an English nickname themselves; follow the student's lead and the family's wishes."], ["h", "Two surnames (dos apellidos)"], ["p", "Many people from Spanish-speaking countries have two surnames. Traditionally, the first surname comes from the father and the second comes from the mother. Conventions vary by country and by family, so when in doubt, ask."], ["table", {"cols": ["Person", "First name", "1st surname (father's)", "2nd surname (mother's)"], "widths": [22, 22, 28, 28], "rows": [["Father", "Luis", "Hernández", "Castillo"], ["Mother", "Marta", "Ruiz", "Ortega"], ["Student", "Daniela", "Hernández", "Ruiz"]]}], ["ul", ["Daniela usually goes by her first surname: Daniela Hernández. File and search for her under H.", "Her mother is Señora Ruiz, not \"Mrs. Hernández.\" Many women keep their own surnames after marriage.", "If a form has only one surname box, ask the family what they prefer. Some families use a hyphen (Hernández-Ruiz).", "Compound first names are common: María José, Juan Pablo, José Luis. Use both parts if the student does."]]], "phrases": [["Hello, what is your name?", "Hola, ¿cómo te llamas?", "OH-lah, KOH-moh teh YAH-mahs"], ["My name is ___.", "Me llamo ___.", "meh YAH-moh"], ["Nice to meet you.", "Mucho gusto.", "MOO-choh GOOS-toh"], ["How do you say your name?", "¿Cómo se dice tu nombre?", "KOH-moh seh DEE-seh too NOHM-breh"], ["Am I saying it right?", "¿Lo digo bien?", "loh DEE-goh BYEHN"], ["Say it again, please.", "Repítelo, por favor.", "rreh-PEE-teh-loh, pohr fah-BOHR"], ["More slowly, please.", "Más despacio, por favor.", "MAHS dehs-PAH-syoh, pohr fah-BOHR"], ["How do you spell it?", "¿Cómo se escribe?", "KOH-moh seh ehs-KREE-beh"], ["Does it have an accent mark?", "¿Lleva acento?", "YEH-bah ah-SEHN-toh"], ["What is your last name?", "¿Cuál es tu apellido?", "KWAHL ehs too ah-peh-YEE-doh"], ["What do you like to be called?", "¿Cómo te gusta que te llamen?", "KOH-moh teh GOOS-tah keh teh YAH-mehn"], ["What is your mom's name?", "¿Cómo se llama tu mamá?", "KOH-moh seh YAH-mah too mah-MAH"], ["Thank you for teaching me.", "Gracias por enseñarme.", "GRAH-syahs pohr ehn-seh-NYAHR-meh"]], "tip": {"title": "Names carry family history", "paras": ["A name often connects a child to parents, grandparents, and a home country. When you take the time to learn it, you honor that connection.", "If a student is shy, practice the name privately rather than in front of the class. If you make a mistake, say \"Perdón. ¿Cómo se dice?\" (Sorry. How do you say it?) and try again. You are modeling exactly what you ask of your English learners: taking a risk with a new language.", "Keep a pronunciation column in your roster and in your substitute plans. A guest teacher who says a name correctly protects the respect you have built."]}, "activities": [{"kind": "match", "type": "Matching", "title": "Letters and sounds", "instr": "Write the letter of the matching sound next to each Spanish letter.", "left": ["h", "j", "ll", "ñ", "z", "qu", "rr"], "right": ["ny, as in canyon", "k, with a silent u", "silent", "rolled or trilled r", "y, as in yes", "s", "breathy h, as in hat"], "answers": ["1. c (silent)", "2. g (breathy h)", "3. e (y, as in yes)", "4. a (ny)", "5. f (s)", "6. b (k, silent u)", "7. d (rolled r)"]}, {"kind": "fill", "type": "Fill-in", "title": "Find the stress", "instr": "Write the stressed syllable in capital letters, then write the rule (1, 2, or 3) that tells you. The first one is done for you.", "items": ["Carmen:  CAR   Rule 1", "Isabel: ____________  Rule ____", "Ramírez: ____________  Rule ____", "Lucas: ____________  Rule ____", "Raúl: ____________  Rule ____", "Salvador: ____________  Rule ____", "Valentina: ____________  Rule ____", "Andrés: ____________  Rule ____"], "answers": ["1. Carmen: CAR, Rule 1 (example)", "2. Isabel: BEL, Rule 2", "3. Ramírez: MÍ, Rule 3", "4. Lucas: LU, Rule 1", "5. Raúl: ÚL, Rule 3", "6. Salvador: DOR, Rule 2", "7. Valentina: TI, Rule 1", "8. Andrés: DRÉS, Rule 3"]}, {"kind": "scenario", "type": "Scenario", "title": "Roster detective", "instr": "Read each situation and write what you would do or say.", "items": ["Your roster lists \"Hernández Ruiz, Daniela.\" Under which letter do you file her work? What is her father's surname?", "Daniela's mother, Marta Ruiz Ortega, comes to pick her up. How do you greet her by name?", "A new student writes \"Juan Pablo Torres Medina\" on an index card. What do you call him in class?", "The office record says \"José Luis García,\" but the student says, \"Me llamo José Luis García Morales.\" What should you do?"], "answers": ["File her under H. Hernández is her father's surname (her first surname); Ruiz is her mother's.", "\"Buenos días, señora Ruiz.\" She is Señora Ruiz, not Mrs. Hernández.", "Juan Pablo, using both parts of the first name, unless he tells you he prefers something else.", "Thank him, use his full name, and ask the family how they want it recorded. Then let the office know so his records match across systems."]}, {"kind": "speak", "type": "Speak aloud", "title": "Read the roster", "instr": "Read each name aloud twice using the sound rules. Then check yourself with the respellings in the answer key.", "items": ["José", "Jesús", "Guadalupe", "Ximena", "Joaquín", "Guillermo", "Yesenia", "Rocío", "Ángel", "Jiménez", "Gutiérrez", "Rodríguez", "Vázquez", "Muñoz", "Hernández", "Iturria"], "answers": ["José (hoh-SEH)", "Jesús (heh-SOOS)", "Guadalupe (gwah-dah-LOO-peh)", "Ximena (hee-MEH-nah)", "Joaquín (hwah-KEEN)", "Guillermo (gee-YEHR-moh)", "Yesenia (yeh-SEH-nyah)", "Rocío (rroh-SEE-oh)", "Ángel (AHN-hehl)", "Jiménez (hee-MEH-nehs)", "Gutiérrez (goo-TYEH-rrehs)", "Rodríguez (rroh-DREE-gehs)", "Vázquez (BAHS-kehs)", "Muñoz (moo-NYOHS)", "Hernández (ehr-NAHN-dehs)", "Iturria (ee-TOO-rryah)"]}, {"kind": "roleplay", "type": "Partner role-play", "title": "First-day name check", "instr": "Partner A is a new student and picks a full name with two surnames from this module. Partner B is the teacher. Use the Ask, Listen, Repeat, Check, Use routine. Then switch roles.", "script": [["Teacher", "Hola. ¿Cómo te llamas?"], ["Student", "Me llamo Yesenia Rodríguez Peña."], ["Teacher", "Mucho gusto, Yesenia. ¿Lo digo bien?"], ["Student", "Sí. (or: No, es Ye-SE-nia.)"], ["Teacher", "Repítelo, por favor. ... ¿Cómo te gusta que te llamen?"], ["Student", "Yesenia."], ["Teacher", "Gracias por enseñarme."]], "checklist": ["Pure vowels, no glides", "Correct stressed syllable", "Used the name at the end", "Identified the first surname"], "answers": ["Answers will vary. Check that the teacher identifies the first surname (in the model, Rodríguez) as the one to file under."]}], "quiz": [{"q": "Which letter is always silent in Spanish?", "opts": ["j", "h", "ll", "ñ"], "a": 1}, {"q": "How is the name José pronounced?", "opts": ["HOH-seh", "hoh-SEH", "JOH-zee", "hoh-ZAY"], "a": 1}, {"q": "In the name Valeria, the v sounds most like:", "opts": ["English v", "English f", "English b", "English w"], "a": 2}, {"q": "Mariana López Castro usually goes by which surname?", "opts": ["López", "Castro", "Mariana", "Both, always with a hyphen"], "a": 0}, {"q": "You are not sure how to say a new student's name. What is the best first step?", "opts": ["Give the student a nickname", "Use only the last name", "Ask the student privately: \"¿Cómo se dice tu nombre?\"", "Skip the name during roll call"], "a": 2}], "cheat": [{"title": "The five vowels", "kind": "pairs", "rows": [["a", "ah (father)"], ["e", "eh (met)"], ["i", "ee (see)"], ["o", "oh (no, short)"], ["u", "oo (moon)"]]}, {"title": "Tricky consonants", "kind": "pairs", "rows": [["h", "silent"], ["j, ge, gi", "breathy h"], ["ll, y", "y (yes)"], ["ñ", "ny (canyon)"], ["z, ce, ci", "s"], ["qu", "k"], ["v", "b"], ["rr", "rolled r"]]}, {"title": "Where is the stress?", "kind": "bullets", "rows": ["Ends in vowel, n, s: next-to-last syllable (CAR-men)", "Ends in another consonant: last syllable (i-sa-BEL)", "Accent mark: stress it (Mar-TÍ-nez)"]}, {"title": "Two surnames", "kind": "bullets", "rows": ["Daniela Hernández Ruiz", "Hernández = father's; file under H", "Ruiz = mother's; Mom is Señora Ruiz", "One box on a form? Ask the family"]}, {"title": "Name routine: Ask, Listen, Repeat, Check, Use", "kind": "phrases", "wide": true, "rows": [["¿Cómo te llamas?", "What is your name?", "KOH-moh teh YAH-mahs"], ["¿Cómo se dice tu nombre?", "How do you say your name?", "KOH-moh seh DEE-seh too NOHM-breh"], ["¿Lo digo bien?", "Am I saying it right?", "loh DEE-goh BYEHN"], ["Repítelo, por favor.", "Say it again, please.", "rreh-PEE-teh-loh, pohr fah-BOHR"], ["¿Cómo te gusta que te llamen?", "What do you like to be called?", "KOH-moh teh GOOS-tah keh teh YAH-mehn"], ["Gracias por enseñarme.", "Thank you for teaching me.", "GRAH-syahs pohr ehn-seh-NYAHR-meh"]]}, {"title": "Remember", "kind": "bullets", "wide": true, "rows": ["Write accent marks on every roster, label, and certificate.", "Do not anglicize a name unless the student asks.", "Add your respelling to your roster and sub plans."]}]}, {"num": 2, "title": "Greetings and Relationships", "es": "Los saludos y las relaciones", "color": "#C8902E", "light": "#FBF3E4", "overview": "A warm, accurate greeting is the fastest way to build a relationship. Learn greetings for every time of day, and learn when to use tú with students and usted with adults.", "goals": ["Greet students and adults correctly for the time of day.", "Choose tú for one student and usted for an adult.", "Use titles and family words that show respect.", "Build short greeting routines for arrival, dismissal, and a student's return after an absence."], "lesson": [["h", "Greetings by time of day"], ["table", {"cols": ["Greeting", "Pronunciation", "When to use it"], "widths": [28, 30, 42], "rows": [["Buenos días.", "BWEH-nohs DEE-ahs", "Morning, until about noon"], ["Buenas tardes.", "BWEH-nahs TAHR-dehs", "Afternoon, from about noon until dark"], ["Buenas noches.", "BWEH-nahs NOH-chehs", "Evening and night; also used as good night"], ["¡Hola!", "OH-lah", "Any time; friendly and informal"]]}], ["p", "Notice buenos with días but buenas with tardes and noches. Día is a masculine word, and tarde and noche are feminine words, so the describing word changes to match."], ["h", "Tú or usted?"], ["p", "Spanish has two common ways to say \"you\" to one person. Tú is familiar. Usted is respectful and formal. As a teacher, you will use tú with a student and usted with parents, grandparents, colleagues, and other adults."], ["table", {"cols": ["", "Tú (one student)", "Usted (one adult)"], "widths": [30, 35, 35], "rows": [["How are you?", "¿Cómo estás?", "¿Cómo está usted?"], ["And you?", "¿Y tú?", "¿Y usted?"], ["Have a good day.", "Que tengas un buen día.", "Que tenga un buen día."], ["your (book)", "tu libro", "su libro"]]}], ["p", "Many students will use usted with you. That is a sign of respect, not distance. If you are unsure which form to use with an adult, choose usted. It is never rude."], ["h", "Titles and relationship words"], ["ul", ["Señor (Sr.), señora (Sra.), and señorita (Srta.) are used with a last name or on their own: \"Buenos días, señora.\"", "Students from many Latin American schools call a teacher Maestro, Maestra, Profesor, Profesora, or simply \"Teacher.\" This is a respectful title, not a sign that the student forgot your name.", "Useful family words: mamá (mom), papá (dad), abuela (grandmother), abuelo (grandfather), tía (aunt), tío (uncle), hermana (sister), hermano (brother), prima / primo (cousin), familia (family).", "Many children are cared for or picked up by grandparents, aunts, uncles, or older cousins. Greet every family adult with the same warmth and respect."]], ["h", "What students may say back"], ["table", {"cols": ["Student says", "Meaning", "You can answer"], "widths": [30, 28, 42], "rows": [["Bien, gracias.", "Fine, thanks.", "¡Qué bueno! (KEH BWEH-noh) Great!"], ["Más o menos.", "So-so.", "¿Por qué? (pohr KEH) Why?"], ["Mal. / Estoy cansado.", "Bad. / I'm tired.", "Lo siento. (loh SYEHN-toh) I'm sorry."], ["¿Y usted, maestra?", "And you, teacher?", "Muy bien, gracias. (MOOY BYEHN) Very well."]]}]], "phrases": [["Good morning.", "Buenos días.", "BWEH-nohs DEE-ahs"], ["Good afternoon.", "Buenas tardes.", "BWEH-nahs TAHR-dehs"], ["Hello!", "¡Hola!", "OH-lah"], ["How are you? (to a student)", "¿Cómo estás?", "KOH-moh ehs-TAHS"], ["How are you? (to an adult)", "¿Cómo está usted?", "KOH-moh ehs-TAH oos-TEHD"], ["Fine, thank you. And you?", "Bien, gracias. ¿Y tú?", "BYEHN, GRAH-syahs. ee TOO"], ["Welcome to class. (to a boy / to a girl)", "Bienvenido a la clase. / Bienvenida a la clase.", "byehn-beh-NEE-doh / byehn-beh-NEE-dah ah lah KLAH-seh"], ["I'm your teacher. (male / female)", "Soy tu maestro. / Soy tu maestra.", "SOY too mah-EHS-troh / mah-EHS-trah"], ["I'm glad you are here.", "Me alegra que estés aquí.", "meh ah-LEH-grah keh ehs-TEHS ah-KEE"], ["We missed you.", "Te extrañamos.", "teh ehks-trah-NYAH-mohs"], ["How was your weekend?", "¿Qué tal tu fin de semana?", "KEH TAHL too FEEN deh seh-MAH-nah"], ["Who is picking you up today?", "¿Quién te recoge hoy?", "KYEHN teh rreh-KOH-heh OY"], ["See you tomorrow.", "Hasta mañana.", "AHS-tah mah-NYAH-nah"], ["See you Monday.", "Hasta el lunes.", "AHS-tah ehl LOO-nehs"], ["Have a good day.", "Que tengas un buen día.", "keh TEHN-gahs oon BWEHN DEE-ah"], ["Goodbye.", "Adiós.", "ah-DYOHS"]], "tip": {"title": "The greeting at the door", "paras": ["In many Spanish-speaking families, children learn to greet each adult when they enter a room. A greeting by name at your door, in Spanish and then in English, meets that expectation and starts each class with a personal connection.", "Moll et al. (1992) showed that students' households hold rich funds of knowledge: skills, practices, and experiences that teachers can learn about and build on. A daily greeting is the first step toward learning what your students bring from home.", "In some families, children show respect to adults by lowering their eyes. Do not assume that a student who looks down while you speak is being rude or is not listening."]}, "activities": [{"kind": "match", "type": "Matching", "title": "The right greeting", "instr": "Match each situation to the best thing to say.", "left": ["8:00 a.m., students arrive", "2:30 p.m., class begins", "A student returns after being out sick", "Friday dismissal", "A mother arrives at 3:15 p.m. pickup", "A new student's first day (a boy)"], "right": ["Hasta el lunes.", "Buenas tardes, señora. ¿Cómo está usted?", "Buenos días.", "Bienvenido a la clase.", "Te extrañamos. Me alegra que estés aquí.", "Buenas tardes."], "answers": ["1. c (Buenos días.)", "2. f (Buenas tardes.)", "3. e (Te extrañamos. Me alegra que estés aquí.)", "4. a (Hasta el lunes.)", "5. b (Buenas tardes, señora. ¿Cómo está usted?)", "6. d (Bienvenido a la clase.)"]}, {"kind": "fill", "type": "Fill-in", "title": "Tú or usted?", "instr": "Complete each sentence with the correct word.", "items": ["(to a student) ¿Cómo ____________?", "(to a student's grandfather) ¿Cómo está ____________?", "(to a student) Que ____________ un buen día.", "(to a parent) Que ____________ un buen día.", "(to the principal) Bien, gracias. ¿Y ____________?", "(to a new girl) Bienvenid____ a la clase."], "answers": ["1. estás", "2. usted", "3. tengas", "4. tenga", "5. usted", "6. Bienvenida"]}, {"kind": "scenario", "type": "Scenario", "title": "What would you say?", "instr": "Write what you would say in Spanish. Add a note about what you would do.", "items": ["Monday morning. Luis walks in slowly and looks sleepy.", "Señora Ruiz arrives early for afternoon pickup and waits by your door.", "A newcomer says, \"Good morning, Teacher,\" every day instead of using your name. A colleague says this is rude. What do you think?"], "answers": ["\"Buenos días, Luis. ¿Cómo estás?\" If he says \"Cansado,\" answer \"Lo siento\" and check in with him privately later.", "\"Buenas tardes, señora Ruiz. ¿Cómo está usted?\" Use usted and her title.", "It is not rude. In many Latin American schools, \"Teacher\" or \"Maestra / Maestro\" is a respectful title. You can teach your name too, while honoring the respect behind the greeting."]}, {"kind": "roleplay", "type": "Partner role-play", "title": "Door greeting, two ways", "instr": "Round 1: Partner A is the teacher at the door and Partner B is a student. Round 2: Partner B is a parent at pickup, so the teacher switches to usted. Then switch roles.", "script": [["Teacher", "Buenos días, Daniela. ¿Cómo estás?"], ["Student", "Más o menos."], ["Teacher", "Lo siento. Me alegra que estés aquí."], ["Teacher (Round 2)", "Buenas tardes, señor. ¿Cómo está usted?"], ["Parent", "Bien, gracias. ¿Y usted?"], ["Teacher", "Muy bien, gracias. Hasta mañana."]], "checklist": ["Greeting matches the time of day", "Tú with the student, usted with the adult", "Used a name or title", "Warm tone"], "answers": ["Answers will vary. Check for estás with the student and está usted with the adult."]}, {"kind": "speak", "type": "Speak aloud", "title": "Pure vowels", "instr": "Say each phrase aloud three times. Record yourself and listen for short, pure vowels: BWEH, not \"BWAY.\"", "items": ["Buenos días.", "Buenas tardes.", "¿Cómo está usted?", "Te extrañamos.", "¿Quién te recoge hoy?", "Que tengas un buen día."], "answers": ["BWEH-nohs DEE-ahs", "BWEH-nahs TAHR-dehs", "KOH-moh ehs-TAH oos-TEHD", "teh ehks-trah-NYAH-mohs", "KYEHN teh rreh-KOH-heh OY", "keh TEHN-gahs oon BWEHN DEE-ah"]}], "quiz": [{"q": "At 1:30 p.m., you greet a class with:", "opts": ["Buenos días.", "Buenas tardes.", "Buenas noches.", "Hasta mañana."], "a": 1}, {"q": "Which question do you use with a student's grandmother?", "opts": ["¿Cómo estás?", "¿Qué tal, amiga?", "¿Cómo está usted?", "¿Y tú?"], "a": 2}, {"q": "A student calls you \"Maestra\" instead of using your last name. This is usually:", "opts": ["Disrespectful", "A respectful title used in many schools", "A joke", "A mistake to correct right away"], "a": 1}, {"q": "\"Te extrañamos\" means:", "opts": ["We missed you.", "See you tomorrow.", "Welcome.", "Who is picking you up?"], "a": 0}, {"q": "To welcome a new girl to class, say:", "opts": ["Bienvenido a la clase.", "Bienvenidos a la clase.", "Bien a la clase.", "Bienvenida a la clase."], "a": 3}], "cheat": [{"title": "Time of day", "kind": "pairs", "rows": [["Buenos días.", "Good morning (to noon)"], ["Buenas tardes.", "Good afternoon"], ["Buenas noches.", "Good evening / night"], ["¡Hola!", "Hi! (any time)"]]}, {"title": "Tú or usted?", "kind": "pairs", "rows": [["Student", "tú: ¿Cómo estás?"], ["Adult", "usted: ¿Cómo está usted?"], ["Not sure?", "Choose usted."], ["your", "tu (student), su (adult)"]]}, {"title": "Arrival and dismissal", "kind": "phrases", "wide": true, "rows": [["Bienvenido / Bienvenida a la clase.", "Welcome to class.", "byehn-beh-NEE-doh / -dah ah lah KLAH-seh"], ["Me alegra que estés aquí.", "I'm glad you are here.", "meh ah-LEH-grah keh ehs-TEHS ah-KEE"], ["Te extrañamos.", "We missed you.", "teh ehks-trah-NYAH-mohs"], ["¿Qué tal tu fin de semana?", "How was your weekend?", "KEH TAHL too FEEN deh seh-MAH-nah"], ["¿Quién te recoge hoy?", "Who is picking you up today?", "KYEHN teh rreh-KOH-heh OY"], ["Hasta mañana. / Hasta el lunes.", "See you tomorrow. / See you Monday.", "AHS-tah mah-NYAH-nah / ehl LOO-nehs"], ["Que tengas un buen día.", "Have a good day. (to a student)", "keh TEHN-gahs oon BWEHN DEE-ah"]]}, {"title": "When they answer", "kind": "pairs", "rows": [["Bien / Muy bien", "Fine / Very well"], ["Más o menos", "So-so"], ["Mal / Cansado", "Bad / Tired"], ["Lo siento.", "I'm sorry."]]}, {"title": "Family words", "kind": "pairs", "rows": [["mamá / papá", "mom / dad"], ["abuela / abuelo", "grandma / grandpa"], ["tía / tío", "aunt / uncle"], ["hermana / hermano", "sister / brother"]]}]}, {"num": 3, "title": "Classroom Directions", "es": "Las instrucciones en clase", "color": "#2B8A9A", "light": "#E5F3F5", "overview": "Short, clear directions help newcomers follow along from day one. Learn to give a direction to one student (tú), to the whole class (ustedes), and to an adult (usted).", "goals": ["Give common classroom directions to one student and to the whole class.", "Explain the pattern that turns a tú command into an ustedes command.", "Use usted commands politely with families and other adults.", "Pair short directions with gestures, visuals, and por favor."], "lesson": [["h", "Three ways to say \"you\" in a command"], ["table", {"cols": ["Form", "Use it with", "\"Sit down\""], "widths": [18, 50, 32], "rows": [["tú", "One student", "Siéntate. (SYEHN-tah-teh)"], ["ustedes", "Two or more people: a group of students or the whole class", "Siéntense. (SYEHN-tehn-seh)"], ["usted", "One adult: a parent, grandparent, or colleague", "Siéntese. (SYEHN-teh-seh)"]]}], ["p", "In Latin America, ustedes is the everyday plural \"you\" for any group, friends or strangers. In Spain you may also hear vosotros. Your students will understand ustedes, and it is the form this course uses."], ["h", "The pattern: from one student to the whole class"], ["p", "Most one-student commands look like the \"he/she\" form of the verb: escucha, mira, escribe, lee. To speak to the whole class, switch the final vowel and add -n:"], ["table", {"cols": ["Verb type", "One student (tú)", "Whole class (ustedes)"], "widths": [34, 33, 33], "rows": [["-ar verbs: a becomes en", "Escucha. Mira. Trabaja.", "Escuchen. Miren. Trabajen."], ["-er and -ir verbs: e becomes an", "Lee. Escribe. Abre.", "Lean. Escriban. Abran."]]}], ["p", "A few common verbs are irregular. Learn them as whole chunks: Ven / Vengan (Come), Haz / Hagan (Do, Make), Pon / Pongan (Put), Sal / Salgan (Go out). Some spelling changes keep the sound the same: Saca becomes Saquen (Take out)."], ["h", "Words that attach to the end"], ["p", "Some commands carry a small word on the end, such as te, se, or me: Siéntate (Sit down), Levántense (Stand up), Muéstrame (Show me). When the word gets longer, Spanish adds a written accent to keep the stress in the same place. Always include that accent on posters and slides."], ["h", "Softening a command"], ["ul", ["Add por favor (pohr fah-BOHR): Siéntense, por favor.", "Use Vamos a + verb (Let's ___) to include yourself: Vamos a leer (BAH-mohs ah leh-EHR), Let's read.", "Use a calm, normal voice. Speaking louder does not make a new language easier to understand; slowing down and gesturing does."]], ["box", "Using usted with adults", ["Pase, por favor. (PAH-seh) Come in, please.", "Siéntese, por favor. (SYEHN-teh-seh) Have a seat, please.", "Espere un momento, por favor. (ehs-PEH-reh oon moh-MEHN-toh) Wait a moment, please.", "Firme aquí, por favor. (FEER-meh ah-KEE) Sign here, please.", "Sígame, por favor. (SEE-gah-meh) Follow me, please."]]], "phrases_kind": "commands", "phrases": [["Sit down.", "Siéntate.", "SYEHN-tah-teh", "Siéntense.", "SYEHN-tehn-seh"], ["Stand up.", "Levántate.", "leh-BAHN-tah-teh", "Levántense.", "leh-BAHN-tehn-seh"], ["Listen.", "Escucha.", "ehs-KOO-chah", "Escuchen.", "ehs-KOO-chehn"], ["Look.", "Mira.", "MEE-rah", "Miren.", "MEE-rehn"], ["Pay attention.", "Pon atención.", "POHN ah-tehn-SYOHN", "Pongan atención.", "POHN-gahn ah-tehn-SYOHN"], ["Open your book(s).", "Abre tu libro.", "AH-breh too LEE-broh", "Abran sus libros.", "AH-brahn soos LEE-brohs"], ["Close your book(s).", "Cierra tu libro.", "SYEH-rrah too LEE-broh", "Cierren sus libros.", "SYEH-rrehn soos LEE-brohs"], ["Take out a pencil.", "Saca un lápiz.", "SAH-kah oon LAH-pees", "Saquen un lápiz.", "SAH-kehn oon LAH-pees"], ["Write.", "Escribe.", "ehs-KREE-beh", "Escriban.", "ehs-KREE-bahn"], ["Read.", "Lee.", "LEH-eh", "Lean.", "LEH-ahn"], ["Raise your hand.", "Levanta la mano.", "leh-BAHN-tah lah MAH-noh", "Levanten la mano.", "leh-BAHN-tehn lah MAH-noh"], ["Repeat.", "Repite.", "rreh-PEE-teh", "Repitan.", "rreh-PEE-tahn"], ["Show me.", "Muéstrame.", "MWEHS-trah-meh", "Muéstrenme.", "MWEHS-trehn-meh"], ["Wait, please.", "Espera, por favor.", "ehs-PEH-rah, pohr fah-BOHR", "Esperen, por favor.", "ehs-PEH-rehn, pohr fah-BOHR"], ["Come here.", "Ven aquí.", "BEHN ah-KEE", "Vengan aquí.", "BEHN-gahn ah-KEE"], ["Work with a partner.", "Trabaja con un compañero.", "trah-BAH-hah kohn oon kohm-pah-NYEH-roh", "Trabajen en parejas.", "trah-BAH-hehn ehn pah-REH-hahs"], ["Line up.", "Haz fila.", "AHS FEE-lah", "Hagan fila.", "AH-gahn FEE-lah"]], "tip": {"title": "Say it, show it, post it", "paras": ["Pair every direction with the same gesture every time: a flat hand moving down for siéntense, a cupped ear for escuchen, an open-book motion for abran sus libros. Consistency lets newcomers act on a direction before they know every word.", "Post a bilingual direction wall with an icon, the English, and the Spanish for your ten most common directions. Point to it as you speak. Over time, students will connect the English words to the routine and need the Spanish less.", "Use Spanish as a bridge, not a replacement. Give the direction in English with a gesture, then in Spanish if needed. As routines become familiar, use less Spanish for them."]}, "activities": [{"kind": "match", "type": "Matching", "title": "Directions to one student", "instr": "Match each English direction to the Spanish tú command.", "left": ["Sit down.", "Listen.", "Write.", "Raise your hand.", "Line up.", "Open your book."], "right": ["Haz fila.", "Abre tu libro.", "Escucha.", "Siéntate.", "Levanta la mano.", "Escribe."], "answers": ["1. d (Siéntate.)", "2. c (Escucha.)", "3. f (Escribe.)", "4. e (Levanta la mano.)", "5. a (Haz fila.)", "6. b (Abre tu libro.)"]}, {"kind": "fill", "type": "Fill-in", "title": "Now tell the whole class", "instr": "Change each one-student command into a whole-class (ustedes) command.", "items": ["Escucha. → ____________", "Mira. → ____________", "Escribe. → ____________", "Lee. → ____________", "Abre tu libro. → ____________", "Siéntate. → ____________", "Ven aquí. → ____________", "Saca un lápiz. → ____________"], "answers": ["1. Escuchen.", "2. Miren.", "3. Escriban.", "4. Lean.", "5. Abran sus libros.", "6. Siéntense.", "7. Vengan aquí.", "8. Saquen un lápiz."]}, {"kind": "scenario", "type": "Scenario", "title": "Tú, ustedes, or usted?", "instr": "Circle the form you need, then write the command in Spanish.", "items": ["Tell Marco to sit down.  (tú / ustedes / usted)", "Tell the whole class to take out a pencil.  (tú / ustedes / usted)", "Invite a student's father into your room.  (tú / ustedes / usted)", "Tell two students to work together.  (tú / ustedes / usted)", "Ask a grandmother to wait a moment.  (tú / ustedes / usted)", "Ask Ana to show you her work.  (tú / ustedes / usted)"], "answers": ["1. tú: Siéntate, por favor.", "2. ustedes: Saquen un lápiz.", "3. usted: Pase, por favor.", "4. ustedes: Trabajen en parejas. (or Trabajen juntos.)", "5. usted: Espere un momento, por favor.", "6. tú: Muéstrame tu trabajo."]}, {"kind": "roleplay", "type": "Partner role-play", "title": "Simón dice (Simon Says)", "instr": "Play with a partner or small group. The leader gives commands, using tú when naming one person and ustedes for everyone. Players act only when they hear \"Simón dice.\" Rotate leaders every five commands.", "script": [["Leader", "Simón dice: levántense."], ["Leader", "Simón dice: miren la puerta."], ["Leader", "Simón dice: Ana, levanta la mano."], ["Leader", "Siéntense. (No one moves. Simón no lo dijo.)"], ["Leader", "Simón dice: siéntense, por favor."]], "checklist": ["-n ending for the group", "Tú form for one person", "Stress in Siéntate / Siéntense", "Matching gesture each time"], "answers": ["Answers will vary. Check that group commands end in -n and one-person commands do not."]}, {"kind": "speak", "type": "Speak aloud", "title": "A morning routine script", "instr": "Read this opening routine aloud as if your class were in front of you. Add a gesture for each line.", "items": ["Buenos días. Siéntense, por favor.", "Saquen un lápiz.", "Abran sus libros en la página diez.", "Escuchen.", "Levanten la mano si tienen una pregunta.", "Muy bien. Vamos a empezar."], "answers": ["BWEH-nohs DEE-ahs. SYEHN-tehn-seh, pohr fah-BOHR.", "SAH-kehn oon LAH-pees.", "AH-brahn soos LEE-brohs ehn lah PAH-hee-nah DYEHS.", "ehs-KOO-chehn.", "leh-BAHN-tehn lah MAH-noh see TYEH-nehn OO-nah preh-GOON-tah.", "MOOY BYEHN. BAH-mohs ah ehm-peh-SAHR."]}], "quiz": [{"q": "To tell one student to listen, say:", "opts": ["Escuchen.", "Escucha.", "Escuche.", "Escuchar."], "a": 1}, {"q": "To tell the whole class to write, say:", "opts": ["Escribe.", "Escribir.", "Escribes.", "Escriban."], "a": 3}, {"q": "Which form do you use to ask a parent to sit down?", "opts": ["Siéntese, por favor.", "Siéntate, por favor.", "Siéntense, por favor.", "Sentar, por favor."], "a": 0}, {"q": "\"Levanten la mano\" means:", "opts": ["Stand up.", "Raise your hand. (to the class)", "Wash your hands.", "Line up."], "a": 1}, {"q": "In most US classrooms with students from Latin America, the everyday plural \"you\" is:", "opts": ["vosotros", "tú", "ustedes", "usted"], "a": 2}], "cheat": [{"title": "Who gets which form?", "kind": "pairs", "rows": [["tú", "one student: Siéntate."], ["ustedes", "group or class: Siéntense."], ["usted", "one adult: Siéntese."]]}, {"title": "The pattern", "kind": "pairs", "rows": [["-ar", "Escucha → Escuchen"], ["-er / -ir", "Escribe → Escriban"], ["Irregular", "Ven → Vengan; Haz → Hagan"]]}, {"title": "Top directions: one student / whole class", "kind": "commands", "wide": true, "rows": [["Sit down.", "Siéntate.", "Siéntense."], ["Stand up.", "Levántate.", "Levántense."], ["Listen.", "Escucha.", "Escuchen."], ["Look.", "Mira.", "Miren."], ["Open your book(s).", "Abre tu libro.", "Abran sus libros."], ["Take out a pencil.", "Saca un lápiz.", "Saquen un lápiz."], ["Write.", "Escribe.", "Escriban."], ["Read.", "Lee.", "Lean."], ["Raise your hand.", "Levanta la mano.", "Levanten la mano."], ["Show me.", "Muéstrame.", "Muéstrenme."], ["Work with a partner.", "Trabaja con un compañero.", "Trabajen en parejas."], ["Line up.", "Haz fila.", "Hagan fila."]]}, {"title": "To adults (usted)", "kind": "pairs", "rows": [["Pase, por favor.", "Come in, please."], ["Siéntese, por favor.", "Have a seat, please."], ["Espere un momento.", "Wait a moment."], ["Sígame, por favor.", "Follow me, please."]]}, {"title": "Make it easy", "kind": "bullets", "rows": ["Same gesture every time", "Add por favor", "Slow down; don't get louder", "Point to the direction wall"]}]}, {"num": 4, "title": "Praise, Support, and Checking In", "es": "Elogios, apoyo y bienestar", "color": "#3F8F5F", "light": "#E8F4EC", "overview": "Encouragement in a student's home language can ease anxiety and build trust. Learn to praise effort specifically, support a student after a mistake, check understanding, and check in on well-being.", "goals": ["Give specific praise that names the effort or strategy.", "Encourage a student to keep trying after a mistake.", "Check for understanding without relying on \"Do you understand?\"", "Check in on how a student feels, and know when to bring in help."], "lesson": [["h", "Make praise specific"], ["p", "¡Muy bien! is a good start. Praise becomes more powerful when it names what the student did. Two simple frames work in any subject:"], ["ul", ["¡Buen trabajo con ___! (BWEHN trah-BAH-hoh kohn) Great job with ___! Example: ¡Buen trabajo con las fracciones!", "Me gusta cómo ___. (meh GOOS-tah KOH-moh) I like how you ___. Example: Me gusta cómo explicaste tu idea. (I like how you explained your idea.)", "Praise effort, not just answers: Trabajaste mucho. (trah-bah-HAHS-teh MOO-choh) You worked hard."]], ["h", "Words that change for boys and girls"], ["p", "Many describing words end in -o for a male and -a for a female. When you describe yourself, match your own gender: a male teacher says Estoy orgulloso de ti; a female teacher says Estoy orgullosa de ti. When you describe a student, match the student: ¿Estás cansado? (to a boy), ¿Estás cansada? (to a girl). Words ending in -e or a consonant, like triste, excelente, and feliz, do not change."], ["h", "Check understanding the smart way"], ["p", "If you ask \"¿Entiendes?\" (Do you understand?), many students will politely say \"sí\" even when they are lost. Ask students to show you instead:"], ["ul", ["¿Pulgar arriba o pulgar abajo? (pool-GAHR ah-RREE-bah oh pool-GAHR ah-BAH-hoh) Thumbs up or thumbs down?", "Muéstrame con los dedos, del uno al cinco. (MWEHS-trah-meh kohn lohs DEH-dohs, dehl OO-noh ahl SEEN-koh) Show me with your fingers, one to five.", "¿Qué vas a hacer primero? (KEH BAHS ah ah-SEHR pree-MEH-roh) What are you going to do first?", "Muéstrame. (MWEHS-trah-meh) Show me. Let the student point to the first step."]], ["p", "Tell students they can answer in either language: Puedes contestar en español o en inglés."], ["h", "Check in on feelings"], ["table", {"cols": ["English", "Spanish (boy / girl)", "Pronunciation"], "widths": [24, 36, 40], "rows": [["happy", "feliz", "feh-LEES"], ["sad", "triste", "TREES-teh"], ["tired", "cansado / cansada", "kahn-SAH-doh / kahn-SAH-dah"], ["nervous", "nervioso / nerviosa", "nehr-BYOH-soh / nehr-BYOH-sah"], ["worried", "preocupado / preocupada", "preh-oh-koo-PAH-doh / -dah"], ["angry", "enojado / enojada", "eh-noh-HAH-doh / eh-noh-HAH-dah"], ["sick", "enfermo / enferma", "ehn-FEHR-moh / ehn-FEHR-mah"], ["so-so", "más o menos", "MAHS oh MEH-nohs"], ["I'm hungry. / I'm sleepy.", "Tengo hambre. / Tengo sueño.", "TEHN-goh AHM-breh / TEHN-goh SWEH-nyoh"]]}], ["box", "When a check-in becomes serious", ["If a student says or shows anything that suggests harm, abuse, danger, or a threat to self or others, follow your school's reporting procedures right away.", "Bring in your counselor or administrator and a qualified interpreter. Do not try to handle a serious disclosure with limited Spanish, and never ask another student to interpret.", "Do not promise to keep a secret. You can say: Estoy aquí para ayudarte. (I'm here to help you.)"]]], "phrases": [["Very good!", "¡Muy bien!", "MOOY BYEHN"], ["Excellent!", "¡Excelente!", "ehk-seh-LEHN-teh"], ["Great job!", "¡Buen trabajo!", "BWEHN trah-BAH-hoh"], ["Keep it up!", "¡Sigue así!", "SEE-geh ah-SEE"], ["You can do it.", "Tú puedes.", "TOO PWEH-dehs"], ["Try again.", "Inténtalo otra vez.", "een-TEHN-tah-loh OH-trah BEHS"], ["Mistakes help us learn.", "Los errores nos ayudan a aprender.", "lohs eh-RROH-rehs nohs ah-YOO-dahn ah ah-prehn-DEHR"], ["Take your time.", "Tómate tu tiempo.", "TOH-mah-teh too TYEHM-poh"], ["I'm proud of you. (male / female speaker)", "Estoy orgulloso de ti. / Estoy orgullosa de ti.", "ehs-TOY ohr-goo-YOH-soh / ohr-goo-YOH-sah deh TEE"], ["Do you need help?", "¿Necesitas ayuda?", "neh-seh-SEE-tahs ah-YOO-dah"], ["What are you going to do first?", "¿Qué vas a hacer primero?", "KEH BAHS ah ah-SEHR pree-MEH-roh"], ["You can answer in Spanish or English.", "Puedes contestar en español o en inglés.", "PWEH-dehs kohn-tehs-TAHR ehn ehs-pah-NYOHL oh ehn een-GLEHS"], ["How do you feel today?", "¿Cómo te sientes hoy?", "KOH-moh teh SYEHN-tehs OY"], ["Are you okay?", "¿Estás bien?", "ehs-TAHS BYEHN"], ["Do you want to talk?", "¿Quieres hablar?", "KYEH-rehs ah-BLAHR"], ["Do you want to go to the nurse?", "¿Quieres ir a la enfermería?", "KYEH-rehs EER ah lah ehn-fehr-meh-REE-ah"], ["I'm here to help you.", "Estoy aquí para ayudarte.", "ehs-TOY ah-KEE PAH-rah ah-yoo-DAHR-teh"]], "tip": {"title": "Quiet is not the same as disengaged", "paras": ["Many new English learners go through a quiet period when they listen far more than they speak. This is a normal part of learning a language. Offer ways to participate without speaking: pointing, gestures, thumbs, drawing, or choosing between two answers.", "Some students love public praise; others feel embarrassed by it. Watch how each student responds. A quiet \"¡Buen trabajo!\" at a desk can mean more than a shout-out.", "Cummins (2001) argues that the way teachers interact with students sends a message about whether their language and identity are valued. A few words of encouragement in Spanish tell a student that who they are is welcome in your classroom."]}, "activities": [{"kind": "match", "type": "Matching", "title": "The right words at the right moment", "instr": "Match each classroom moment to the best phrase.", "left": ["A student solves a hard problem.", "A student gets a wrong answer and looks frustrated.", "A student is working slowly but carefully.", "You want to check that a student understood the directions.", "A student looks pale and holds her stomach.", "A student has turned in every assignment this week."], "right": ["¿Qué vas a hacer primero?", "Tómate tu tiempo.", "¡Excelente! ¡Buen trabajo!", "¿Estás bien? ¿Quieres ir a la enfermería?", "Estoy orgulloso / orgullosa de ti.", "Inténtalo otra vez. Tú puedes."], "answers": ["1. c (¡Excelente! ¡Buen trabajo!)", "2. f (Inténtalo otra vez. Tú puedes.)", "3. b (Tómate tu tiempo.)", "4. a (¿Qué vas a hacer primero?)", "5. d (¿Estás bien? ¿Quieres ir a la enfermería?)", "6. e (Estoy orgulloso / orgullosa de ti.)"]}, {"kind": "fill", "type": "Fill-in", "title": "Complete the phrase", "instr": "Write the missing word. Watch for -o and -a endings.", "items": ["(a female teacher) Estoy ____________ de ti. (proud)", "(to a boy) ¿Estás ____________? (tired)", "(to a girl) ¿Estás ____________? (nervous)", "¿Necesitas ____________? (help)", "Los errores nos ayudan a ____________. (learn)", "Puedes contestar en español o en ____________. (English)"], "answers": ["1. orgullosa", "2. cansado", "3. nerviosa", "4. ayuda", "5. aprender", "6. inglés"]}, {"kind": "scenario", "type": "Scenario", "title": "What would you do?", "instr": "Write what you would say and do in each situation.", "items": ["You ask Mateo \"¿Entiendes?\" He says \"Sí,\" but two minutes later he has not started.", "Lucía puts her head on her desk. When you ask \"¿Estás bien?\" she says, \"Estoy triste.\"", "During a check-in, a student says something that makes you worry someone at home is hurting him."], "answers": ["Kneel beside him and ask \"¿Qué vas a hacer primero?\" or say \"Muéstrame.\" Point to the first step, model it, and check back in a few minutes.", "\"Lo siento. ¿Quieres hablar?\" Give her a moment, offer a quiet task or a short break, and follow up privately. Let the counselor know if the sadness continues.", "Stay calm and say \"Estoy aquí para ayudarte.\" Do not question him further or promise secrecy. Follow your school's mandated reporting procedures immediately, and involve the counselor or administrator and a qualified interpreter."]}, {"kind": "roleplay", "type": "Partner role-play", "title": "Desk-side check-in", "instr": "Partner A is the teacher; Partner B is a student working on a task. The teacher checks feelings, checks understanding without \"¿Entiendes?\", and gives specific praise. Then switch.", "script": [["Teacher", "Hola, Carlos. ¿Cómo te sientes hoy?"], ["Student", "Más o menos. Estoy cansado."], ["Teacher", "Lo siento. ¿Qué vas a hacer primero?"], ["Student", "(points to step 1)"], ["Teacher", "¡Muy bien! Muéstrame con los dedos, del uno al cinco."], ["Student", "(shows four fingers)"], ["Teacher", "¡Buen trabajo con el primer paso! ¡Sigue así!"]], "checklist": ["Feelings check-in", "Understanding check without ¿Entiendes?", "Specific praise", "Correct -o / -a ending"], "answers": ["Answers will vary. The understanding check should ask the student to show or tell, not just say sí."]}, {"kind": "speak", "type": "Speak aloud", "title": "The praise ladder", "instr": "Say each line aloud with real enthusiasm. Stress the capitalized syllable in the respelling.", "items": ["¡Muy bien!", "¡Excelente!", "¡Buen trabajo!", "¡Sigue así!", "Tú puedes.", "Los errores nos ayudan a aprender."], "answers": ["MOOY BYEHN", "ehk-seh-LEHN-teh", "BWEHN trah-BAH-hoh", "SEE-geh ah-SEE", "TOO PWEH-dehs", "lohs eh-RROH-rehs nohs ah-YOO-dahn ah ah-prehn-DEHR"]}], "quiz": [{"q": "Which is the best way to check whether a student understood the directions?", "opts": ["Ask only \"¿Entiendes?\"", "Ask \"¿Qué vas a hacer primero?\"", "Ask \"¿Estás bien?\"", "Say \"¡Muy bien!\""], "a": 1}, {"q": "A female teacher wants to say \"I'm proud of you.\" She says:", "opts": ["Estoy orgulloso de ti.", "Eres orgullosa.", "Estoy orgullosa de ti.", "Estás orgulloso."], "a": 2}, {"q": "\"Tómate tu tiempo\" means:", "opts": ["Hurry up.", "Take your time.", "It's time to go.", "What time is it?"], "a": 1}, {"q": "A student says \"Tengo sueño.\" She is:", "opts": ["sleepy", "hungry", "sad", "sick"], "a": 0}, {"q": "A student says something that suggests possible harm at home. You should:", "opts": ["Ask many follow-up questions in Spanish", "Ask a bilingual classmate to help", "Wait to see if it happens again", "Follow your school's reporting procedures right away and involve qualified staff and an interpreter"], "a": 3}], "cheat": [{"title": "Praise", "kind": "pairs", "rows": [["¡Muy bien!", "Very good!"], ["¡Excelente!", "Excellent!"], ["¡Buen trabajo con ___!", "Great job with ___!"], ["Me gusta cómo ___.", "I like how you ___."], ["¡Sigue así!", "Keep it up!"]]}, {"title": "Support", "kind": "pairs", "rows": [["Tú puedes.", "You can do it."], ["Inténtalo otra vez.", "Try again."], ["Tómate tu tiempo.", "Take your time."], ["¿Necesitas ayuda?", "Do you need help?"], ["Los errores nos ayudan a aprender.", "Mistakes help us learn."]]}, {"title": "Check understanding (not just ¿Entiendes?)", "kind": "phrases", "wide": true, "rows": [["¿Pulgar arriba o pulgar abajo?", "Thumbs up or thumbs down?", "pool-GAHR ah-RREE-bah oh pool-GAHR ah-BAH-hoh"], ["Muéstrame con los dedos, del uno al cinco.", "Show me with your fingers, one to five.", "MWEHS-trah-meh kohn lohs DEH-dohs"], ["¿Qué vas a hacer primero?", "What are you going to do first?", "KEH BAHS ah ah-SEHR pree-MEH-roh"], ["Puedes contestar en español o en inglés.", "You can answer in Spanish or English.", "PWEH-dehs kohn-tehs-TAHR ehn ehs-pah-NYOHL"]]}, {"title": "Check in", "kind": "pairs", "rows": [["¿Cómo te sientes hoy?", "How do you feel today?"], ["¿Estás bien?", "Are you okay?"], ["¿Quieres hablar?", "Do you want to talk?"], ["¿Quieres ir a la enfermería?", "Go to the nurse?"], ["Estoy aquí para ayudarte.", "I'm here to help you."]]}, {"title": "Feelings (boy / girl)", "kind": "pairs", "rows": [["feliz / triste", "happy / sad"], ["cansado / cansada", "tired"], ["nervioso / nerviosa", "nervous"], ["enfermo / enferma", "sick"], ["más o menos", "so-so"]]}, {"title": "Serious concern? Stop and get help.", "kind": "bullets", "wide": true, "alert": true, "rows": ["Follow reporting procedures right away. Involve the counselor or administrator and a qualified interpreter. Never use a student to interpret. Do not promise secrecy."]}]}, {"num": 5, "title": "Academic Language", "es": "El lenguaje académico", "color": "#7A5C9E", "light": "#F0EBF6", "overview": "Your students' Spanish is a resource for learning content. Use cognates, watch for false cognates, offer bilingual sentence frames, and plan routines that let students think in one language and produce in another.", "goals": ["Use Spanish-English cognates to make content vocabulary more accessible.", "Recognize common false cognates and prevent confusion.", "Provide bilingual sentence frames for academic talk and writing.", "Run a Talk Then Write routine in which students may think and talk in either language.", "Plan a Preview-View-Review lesson."], "lesson": [["h", "Why the home language helps"], ["p", "Cummins (2001) describes how concepts and skills learned in one language support learning in another. A student who already understands photosynthesis or fractions in Spanish does not need to relearn the idea, only the English words for it. García, Johnson, and Seltzer (2017) describe translanguaging: students draw on their whole language repertoire to make meaning, and teachers can plan lessons that invite this on purpose. You do not need to be fluent in Spanish to open that door."], ["h", "Cognates: words that are shared"], ["p", "Cognates are words that look alike, sound alike, and mean the same thing in two languages. Much academic English comes from Latin, so many content words have close Spanish relatives. Spelling patterns make them easy to spot:"], ["table", {"cols": ["English ending", "Spanish ending", "Example"], "widths": [25, 25, 50], "rows": [["-tion", "-ción", "evaporation / evaporación"], ["-ty", "-dad", "community / comunidad"], ["-ous", "-oso", "famous / famoso"], ["-ly", "-mente", "finally / finalmente"], ["-ic", "-ico", "electric / eléctrico"], ["-ist", "-ista", "artist / artista"], ["-ent, -ant", "-ente, -ante", "different / diferente; important / importante"]]}], ["h", "Cognates by subject"], ["table", {"cols": ["Math", "Science", "Social Studies", "ELA"], "widths": [25, 25, 25, 25], "rows": [["ecuación (equation)", "célula (cell)", "constitución (constitution)", "narrador (narrator)"], ["fracción (fraction)", "energía (energy)", "democracia (democracy)", "conflicto (conflict)"], ["triángulo (triangle)", "hipótesis (hypothesis)", "colonia (colony)", "poema (poem)"], ["área (area)", "experimento (experiment)", "revolución (revolution)", "párrafo (paragraph)"], ["multiplicar (multiply)", "observar (observe)", "presidente (president)", "describir (describe)"], ["problema (problem)", "planeta (planet)", "economía (economy)", "comparar (compare)"]]}], ["p", "Pronunciation: ecuación (eh-kwah-SYOHN), célula (SEH-loo-lah), hipótesis (ee-POH-teh-sees), constitución (kohns-tee-too-SYOHN), párrafo (PAH-rrah-foh)."], ["p", "Make cognates explicit. Say, \"This word is a cognate,\" write both words, and color-code cognates on your word wall. Students with strong schooling in Spanish will often recognize academic cognates quickly. Students whose schooling was interrupted may not know the Spanish academic word either, so teach the concept in both languages."], ["h", "False cognates: look-alikes that fool you"], ["table", {"cols": ["Spanish word", "Really means", "Not", "For the English meaning, use"], "widths": [20, 24, 20, 36], "rows": [["embarazada", "pregnant", "embarrassed", "avergonzado / avergonzada"], ["éxito", "success", "exit", "salida"], ["librería", "bookstore", "library", "biblioteca"], ["carpeta", "folder", "carpet", "alfombra"], ["actual", "current, present-day", "actual (real)", "real, verdadero"], ["realizar", "to carry out", "to realize", "darse cuenta"], ["asistir", "to attend", "to assist", "ayudar"], ["lectura", "reading", "lecture", "conferencia, clase"], ["recordar", "to remember, to remind", "to record", "grabar"], ["sopa", "soup", "soap", "jabón"]]}], ["h", "Bilingual sentence frames"], ["table", {"cols": ["English frame", "Spanish frame", "Pronunciation"], "widths": [32, 34, 34], "rows": [["I think ___ because ___.", "Creo que ___ porque ___.", "KREH-oh keh ... POHR-keh"], ["I agree with ___ because ___.", "Estoy de acuerdo con ___ porque ___.", "ehs-TOY deh ah-KWEHR-doh kohn"], ["I disagree because ___.", "No estoy de acuerdo porque ___.", "NOH ehs-TOY deh ah-KWEHR-doh"], ["I notice that ___.", "Noto que ___.", "NOH-toh keh"], ["I wonder ___.", "Me pregunto ___.", "meh preh-GOON-toh"], ["___ is similar to ___ because ___.", "___ es parecido a ___ porque ___.", "ehs pah-reh-SEE-doh ah"], ["The evidence shows that ___.", "La evidencia muestra que ___.", "lah eh-bee-DEHN-syah MWEHS-trah keh"], ["First, ___. Then, ___. Finally, ___.", "Primero, ___. Luego, ___. Por último, ___.", "pree-MEH-roh, LWEH-goh, pohr OOL-tee-moh"]]}], ["h", "Talk Then Write"], ["p", "Talk Then Write gives students time to build an idea orally, in any language, before they write in English."], ["ol", ["Pose the question and post a bilingual sentence frame.", "Think time: Piensa. (PYEHN-sah) Give about 30 seconds of quiet thinking.", "Talk with a partner in Spanish, English, or both: Habla con tu compañero. Puedes usar español o inglés.", "Share aloud using the frame, in English if the student is ready.", "Write: Ahora, escribe. Students write in English. Newcomers may draft in Spanish or mix languages first, then revise with the frame and a word bank."]], ["h", "Preview-View-Review"], ["table", {"cols": ["Preview (Spanish)", "View (English)", "Review (Spanish or both)"], "widths": [33, 34, 33], "rows": [["Before the lesson, students get the big idea and three to five key words in Spanish: a short bilingual summary, a picture, a video, or a partner talk.", "Teach the main lesson in English with visuals, gestures, and cognates highlighted. Students now have a map for what they hear.", "After the lesson, students summarize with a partner in Spanish, complete a bilingual exit ticket, or answer \"¿Qué aprendiste hoy?\""]]}], ["p", "For Spanish previews, use reputable bilingual materials, bilingual colleagues, or a translated summary checked by a fluent speaker. Bilingual classmates can be wonderful learning partners in Preview and Review, but they are partners, not interpreters."]], "phrases": [["Today we are going to learn about ___.", "Hoy vamos a aprender sobre ___.", "OY BAH-mohs ah ah-prehn-DEHR SOH-breh"], ["Key words", "Palabras clave", "pah-LAH-brahs KLAH-beh"], ["This word is a cognate.", "Esta palabra es un cognado.", "EHS-tah pah-LAH-brah ehs oon kohg-NAH-doh"], ["Think.", "Piensa.", "PYEHN-sah"], ["Talk with your partner. (boy / girl partner)", "Habla con tu compañero. / Habla con tu compañera.", "AH-blah kohn too kohm-pah-NYEH-roh / kohm-pah-NYEH-rah"], ["You can use Spanish or English.", "Puedes usar español o inglés.", "PWEH-dehs oo-SAHR ehs-pah-NYOHL oh een-GLEHS"], ["Use the sentence frame.", "Usa el marco de oración.", "OO-sah ehl MAHR-koh deh oh-rah-SYOHN"], ["Now, write.", "Ahora, escribe.", "ah-OH-rah, ehs-KREE-beh"], ["Explain your answer.", "Explica tu respuesta.", "ehks-PLEE-kah too rrehs-PWEHS-tah"], ["Give an example.", "Da un ejemplo.", "DAH oon eh-HEHM-ploh"], ["Why?", "¿Por qué?", "pohr KEH"], ["What did you learn today?", "¿Qué aprendiste hoy?", "KEH ah-prehn-DEES-teh OY"]], "tip": {"title": "Spanish is a resource, not a crutch", "paras": ["Letting students think and talk in Spanish does not hold back their English. It lets them do grade-level thinking while their English grows, and gives them something worth saying when they write in English.", "Do not translate every sentence of your lesson. When everything is repeated in Spanish, some students learn to wait for the Spanish and stop listening to the English. Use Spanish strategically: to preview, to clarify a key concept, and to review.", "Build a multilingual word wall with cognates color-coded. Invite students to add words and pictures, and to teach you the Spanish."]}, "activities": [{"kind": "match", "type": "Matching", "title": "False cognates", "instr": "Match each Spanish word to what it really means.", "left": ["embarazada", "éxito", "librería", "carpeta", "asistir", "sopa"], "right": ["folder", "soup", "pregnant", "to attend", "success", "bookstore"], "answers": ["1. c (pregnant)", "2. e (success)", "3. f (bookstore)", "4. a (folder)", "5. d (to attend)", "6. b (soup)"]}, {"kind": "fill", "type": "Fill-in", "title": "Crack the cognate code", "instr": "Use the spelling patterns to write the Spanish cognate.", "items": ["population → ____________", "equality → ____________", "nervous → ____________", "finally → ____________", "electric → ____________", "dentist → ____________", "important → ____________", "evaporation → ____________"], "answers": ["1. población", "2. igualdad", "3. nervioso", "4. finalmente", "5. eléctrico", "6. dentista", "7. importante", "8. evaporación"]}, {"kind": "scenario", "type": "Scenario", "title": "Plan a Preview-View-Review", "instr": "You teach a 7th-grade science lesson on the water cycle. Two students are newcomers from Honduras with strong schooling in Spanish. Plan each part.", "items": ["Preview (Spanish): What will students see, hear, or read before the lesson? List three to five key words.", "View (English): How will you make the main lesson accessible?", "Review (Spanish or both): How will students show what they learned?"], "answers": ["Sample: a short Spanish summary or video on el ciclo del agua, with key cognates evaporación, condensación, and precipitación, plus a labeled diagram. Students discuss it with a partner.", "Sample: teach in English with a labeled diagram, gestures for rising and falling water, and the cognates color-coded on the board. Pause to point out each cognate.", "Sample: partners explain the cycle in Spanish using Primero, Luego, Por último, then complete a bilingual exit ticket: label the diagram in English and write one sentence with a frame."]}, {"kind": "roleplay", "type": "Partner role-play", "title": "Talk Then Write", "instr": "Run the routine with a partner. Partner A is the teacher and uses the Spanish teacher phrases. Partner B is the student and answers with a sentence frame. Then both write two sentences in English. Switch roles with a new question.", "script": [["Teacher", "¿Qué es más importante para una comunidad: un parque o una biblioteca? Piensa."], ["Teacher", "Habla con tu compañero. Puedes usar español o inglés."], ["Student", "Creo que una biblioteca es más importante porque ..."], ["Teacher", "¿Por qué? Da un ejemplo."], ["Teacher", "Muy bien. Usa el marco de oración. Ahora, escribe."]], "checklist": ["Think time given", "Either language invited", "Frame used aloud", "Written in English with the frame"], "answers": ["Answers will vary. Sample written response: I think a library is more important because people can learn for free. For example, students can use the computers there."]}, {"kind": "speak", "type": "Speak aloud", "title": "Cognate read-aloud", "instr": "Read each cognate aloud in Spanish, then in English. Notice how the stressed syllable often moves.", "items": ["ecuación", "fracción", "célula", "energía", "hipótesis", "democracia", "revolución", "párrafo"], "answers": ["ecuación (eh-kwah-SYOHN)", "fracción (frahk-SYOHN)", "célula (SEH-loo-lah)", "energía (eh-nehr-HEE-ah)", "hipótesis (ee-POH-teh-sees)", "democracia (deh-moh-KRAH-syah)", "revolución (rreh-boh-loo-SYOHN)", "párrafo (PAH-rrah-foh)"]}], "quiz": [{"q": "Which pair is a true cognate (same meaning)?", "opts": ["éxito / exit", "carpeta / carpet", "célula / cell", "librería / library"], "a": 2}, {"q": "\"Embarazada\" means:", "opts": ["embarrassed", "pregnant", "busy", "tired"], "a": 1}, {"q": "The English ending -ty usually becomes:", "opts": ["-ción", "-mente", "-oso", "-dad"], "a": 3}, {"q": "In Talk Then Write, students:", "opts": ["Think and talk in either language, then write using a frame", "Must talk only in English", "Write first, in silence", "Copy the teacher's answer"], "a": 0}, {"q": "In Preview-View-Review, the \"View\" step is:", "opts": ["A Spanish summary before the lesson", "The main lesson in English with visuals and cognates", "A test", "A homework video"], "a": 1}], "cheat": [{"title": "Cognate patterns", "kind": "pairs", "rows": [["-tion → -ción", "evaporación"], ["-ty → -dad", "comunidad"], ["-ous → -oso", "famoso"], ["-ly → -mente", "finalmente"], ["-ic → -ico", "eléctrico"]]}, {"title": "False cognates", "kind": "pairs", "rows": [["embarazada", "pregnant"], ["éxito", "success"], ["librería", "bookstore"], ["carpeta", "folder"], ["asistir", "to attend"]]}, {"title": "Sentence frames", "kind": "phrases", "wide": true, "rows": [["Creo que ___ porque ___.", "I think ___ because ___.", "KREH-oh keh ... POHR-keh"], ["Estoy de acuerdo con ___ porque ___.", "I agree with ___ because ___.", "ehs-TOY deh ah-KWEHR-doh kohn"], ["Noto que ___. / Me pregunto ___.", "I notice that ___. / I wonder ___.", "NOH-toh keh / meh preh-GOON-toh"], ["La evidencia muestra que ___.", "The evidence shows that ___.", "lah eh-bee-DEHN-syah MWEHS-trah keh"], ["Primero ... Luego ... Por último ...", "First ... Then ... Finally ...", "pree-MEH-roh, LWEH-goh, pohr OOL-tee-moh"]]}, {"title": "Talk Then Write", "kind": "bullets", "rows": ["1. Question + frame", "2. Piensa. (think time)", "3. Habla con tu compañero.", "4. Share with the frame", "5. Ahora, escribe."]}, {"title": "Preview-View-Review", "kind": "bullets", "rows": ["Preview: big idea + key words in Spanish", "View: lesson in English, visuals, cognates", "Review: partner talk, exit ticket, ¿Qué aprendiste hoy?"]}]}, {"num": 6, "title": "Talking with Families", "es": "Hablar con las familias", "color": "#3A5BA0", "light": "#E8EEF8", "overview": "Families are your partners. Learn to make a short good-news call, welcome families to a conference, and recognize when your Spanish should stop and a qualified interpreter should take over.", "goals": ["Make a short good-news phone call or leave a voicemail in Spanish.", "Welcome families and open a conference using usted.", "Recognize when to stop and bring in a qualified interpreter.", "Explain why students should never interpret for their own families or for others.", "Protect families by never asking about immigration status."], "lesson": [["h", "Start with good news"], ["p", "Many families hear from school only when something is wrong. A first call that brings good news builds trust before any problem comes up. Say \"Todo está bien\" (Everything is fine) early, so the parent can relax and listen."], ["table", {"cols": ["Step", "Spanish", "English"], "widths": [8, 50, 42], "rows": [["1", "Buenas tardes. ¿Hablo con la mamá de Daniela?", "Good afternoon. Am I speaking with Daniela's mom?"], ["2", "Habla la maestra Smith, la maestra de Daniela.", "This is Ms. Smith, Daniela's teacher."], ["3", "Todo está bien. Le llamo con buenas noticias.", "Everything is fine. I'm calling with good news."], ["4", "Daniela trabajó mucho hoy en matemáticas.", "Daniela worked hard today in math."], ["5", "Gracias por su apoyo.", "Thank you for your support."], ["6", "Que tenga un buen día. Adiós.", "Have a good day. Goodbye."]]}], ["p", "A male teacher says el maestro: \"Habla el maestro Smith, el maestro de Daniela.\" Other good news to share: ayudó a un compañero (helped a classmate), participó en clase (participated in class), terminó su proyecto (finished the project)."], ["box", "Voicemail script", ["Buenas tardes. Le llama la maestra Smith, la maestra de Daniela. Todo está bien. Le llamo con buenas noticias: Daniela trabajó mucho hoy. Gracias. Adiós.", "(Good afternoon. This is Ms. Smith, Daniela's teacher. Everything is fine. I'm calling with good news: Daniela worked hard today. Thank you. Goodbye.)"]], ["h", "Welcoming families to a conference"], ["ul", ["Arrange a qualified interpreter ahead of time for any full conference unless you are fluent. Ask the family their preferred language when you schedule.", "Open the meeting yourself in Spanish: Bienvenidos. Pase, por favor. Siéntese, por favor. It shows respect even when the interpreter does the rest.", "Look at and speak to the parent, not the interpreter. Say \"Your daughter is reading more,\" not \"Tell her that her daughter...\"", "Use short sentences and pause often so the interpreter can keep up. Explain or avoid acronyms and jargon such as IEP, MTSS, or benchmark.", "Bring student work to show progress. Ask about strengths at home: ¿Qué le gusta hacer a Daniela en casa? (What does Daniela like to do at home?) Moll et al. (1992) found that families' everyday knowledge and skills are valuable resources for teaching."]], ["h", "When to use a qualified interpreter"], ["p", "Your Spanish phrases are for greetings, good news, and simple logistics. For anything serious, use a qualified interpreter, in person, by phone, or by video. Under federal civil rights law, schools must communicate with families who have limited English in a language they can understand. Ask your school how to request an interpreter."], ["table", {"cols": ["Your Spanish phrases are fine for", "Always use a qualified interpreter for"], "widths": [50, 50], "rows": [["Greetings and introductions", "Grades, failing, or retention"], ["Good-news calls and voicemails", "Discipline, suspension, or behavior plans"], ["Reminders: picture day, a field trip, a schedule", "Special education: evaluations, IEP and 504 meetings"], ["Opening and closing a conference", "Health, safety, attendance, or counseling concerns"], ["Asking for a good time to call back", "Anything legal, custody-related, or emotional"]]}], ["box", "Never use students as interpreters", ["Do not ask a student, a sibling, or another child to interpret for a family, even if the student offers and even for something that seems simple.", "It places a child in an adult role and can add stress. A child may not know the vocabulary and may soften or change a message, especially one about their own grades or behavior. It also takes away the family's privacy.", "Say kindly: Gracias, pero vamos a usar un intérprete. (Thank you, but we are going to use an interpreter.)"]], ["box", "Never ask about immigration status", ["In Plyler v. Doe (1982), the U.S. Supreme Court ruled that public schools may not deny children a free K-12 education because of their immigration status.", "Do not as
