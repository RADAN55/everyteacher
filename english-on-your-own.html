<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English On Your Own · EL Publishing</title>
<meta name="description" content="A free, self-paced English course for teenagers learning English. Placement check, sixteen units across four levels, speaking practice that listens to you, conversations, and a daily fifteen minutes. Support in Spanish, Vietnamese, Arabic, Chinese and Haitian Creole. No account, no teacher needed.">
<meta property="og:title" content="English On Your Own">
<meta property="og:description" content="Learn English by yourself. Sixteen units, speaking practice that listens to you, real conversations, and a daily fifteen minutes — in six languages, with no account and no teacher needed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1E2761;--navy-dk:#141A44;--gold:#C9A227;--gold-lt:#EBD9A0;--paper:#fff;--mist:#F4F5FA;--ink:#1F2330;--muted:#5D6480;--rule:#DCDEE9;--ok:#2E7D4F;--ok-lt:#E8F5ED;--bad:#B3261E;--bad-lt:#FDECEA;--teal:#0E7C86;--teal-lt:#E6F2F3;--purple:#7A3E9D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--mist);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.55;padding-bottom:84px}
body[dir=rtl]{font-size:18px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
h1,h2,h3{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em;line-height:1.12;margin:0}
.hide{display:none!important}

/* top bar */
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.hb{max-width:720px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px;min-height:54px}
.hb .ttl{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb button{background:transparent;border:1.5px solid rgba(235,217,160,.55);color:var(--gold-lt);border-radius:999px;padding:5px 13px;font-size:13.5px;font-weight:600}
.hb button:hover{background:rgba(235,217,160,.14)}
.xp{background:var(--gold);color:var(--navy-dk);border-radius:999px;padding:4px 12px;font-weight:800;font-size:13.5px;white-space:nowrap}

/* bottom tabs */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--rule);z-index:25;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11.5px;font-weight:600}
nav.tabs button span.i{font-size:21px;line-height:1}
nav.tabs button.on{color:var(--navy)}
nav.tabs button.on span.i{transform:translateY(-1px)}

main{padding:20px 0 30px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:18px 20px;margin:0 0 14px}
.card.flat{border-radius:0;border-left:0;border-right:0;margin-left:-18px;margin-right:-18px}
.btn{display:inline-block;background:var(--gold);color:var(--navy-dk);font-weight:700;border:0;border-radius:999px;padding:13px 26px;font-size:16.5px;text-decoration:none;text-align:center}
.btn:disabled{opacity:.42;cursor:default}
.btn.block{display:block;width:100%}
.btn.ghost{background:transparent;border:2px solid var(--navy);color:var(--navy)}
.btn.sm{padding:8px 16px;font-size:14.5px}
.btn.go{background:var(--navy);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{margin-top:14px}
.muted{color:var(--muted)}
.tiny{font-size:13.5px}
.k{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.k.t{color:var(--teal)}

/* splash */
#splash{position:fixed;inset:0;background:var(--navy);color:#fff;z-index:60;overflow:auto;display:flex;align-items:center}
#splash::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(112deg,rgba(235,217,160,.08) 0 2px,transparent 2px 24px)}
#splash .in{position:relative;max-width:560px;margin:0 auto;padding:40px 22px}
#splash h1{font-size:clamp(34px,8vw,52px);margin:0 0 6px}
#splash h1 em{font-style:italic;color:var(--gold)}
#splash p.sub{color:#C9CEEA;font-size:17px;margin:0 0 26px}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.langs button{background:rgba(255,255,255,.07);border:1.5px solid rgba(235,217,160,.4);color:#fff;border-radius:12px;padding:15px 12px;font-size:17px;font-weight:600;display:flex;align-items:center;gap:10px;justify-content:flex-start}
.langs button:hover{background:rgba(235,217,160,.18)}
.langs button b{font-size:22px;font-weight:400}
#splash .note{margin-top:22px;font-size:13.5px;color:#9AA3CC;border-top:1px solid rgba(255,255,255,.14);padding-top:14px}

/* path */
.lvhead{display:flex;align-items:center;gap:10px;margin:26px 0 10px}
.lvhead .dot{width:12px;height:12px;border-radius:50%;flex:none}
.lvhead h2{font-size:21px}
.lvhead small{color:var(--muted);font-size:13px;font-weight:600}
.unit{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;margin-bottom:9px;width:100%;text-align:left;border-left:5px solid var(--rule)}
body[dir=rtl] .unit{text-align:right;border-left:1px solid var(--rule);border-right:5px solid var(--rule)}
.unit .ic{font-size:27px;flex:none;width:40px;text-align:center}
.unit .tx{flex:1;min-width:0}
.unit .tx b{display:block;font-size:16.5px;color:var(--ink);font-weight:600;line-height:1.25}
.unit .tx small{color:var(--muted);font-size:13px}
.unit .st{flex:none;font-size:19px;width:26px;text-align:center}
.unit.lock{opacity:.52}
.unit.done{border-left-color:var(--ok)}
body[dir=rtl] .unit.done{border-right-color:var(--ok)}
.unit.now{border-left-color:var(--gold);box-shadow:0 3px 14px rgba(30,39,97,.09)}
body[dir=rtl] .unit.now{border-right-color:var(--gold)}

/* stage chrome */
.steps{display:flex;gap:6px;margin:0 0 16px}
.steps div{flex:1;height:6px;border-radius:999px;background:var(--rule)}
.steps div.on{background:var(--gold)}
.steps div.ok{background:var(--ok)}
.stagehd{margin-bottom:14px}
.stagehd h2{font-size:25px;color:var(--navy);margin-bottom:3px}
.stagehd p{margin:0;color:var(--muted);font-size:15px}

/* word cards */
.wordlist{display:grid;gap:9px}
.wd{display:flex;gap:13px;align-items:center;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px 15px;width:100%;text-align:left}
body[dir=rtl] .wd{text-align:right}
.wd .em{font-size:26px;flex:none}
.wd .tx{flex:1;min-width:0}
.wd .tx b{display:block;font-size:18px;color:var(--navy);font-weight:700}
.wd .tx .tr{display:block;color:var(--teal);font-size:15.5px;font-weight:600;line-height:1.3}
.wd .tx .ex{color:var(--muted);font-size:14px;margin-top:2px}
.wd .pl{flex:none;font-size:19px;opacity:.6}
.wd.played{border-color:var(--ok);background:var(--ok-lt)}

/* quiz options */
.opts{display:grid;gap:9px;margin-top:12px}
.opt{background:var(--paper);border:2px solid var(--rule);border-radius:12px;padding:13px 16px;text-align:left;font-size:16.5px;width:100%}
body[dir=rtl] .opt{text-align:right}
.opt:hover{border-color:var(--navy)}
.opt.sel{border-color:var(--navy);background:#F2F4FF}
.opt.good{border-color:var(--ok);background:var(--ok-lt)}
.opt.bad{border-color:var(--bad);background:var(--bad-lt)}
.fb{margin-top:12px;border-radius:12px;padding:12px 16px;font-size:15.5px;font-weight:600}
.fb.good{background:var(--ok-lt);color:var(--ok);border:1px solid #BFE0CC}
.fb.bad{background:var(--bad-lt);color:var(--bad);border:1px solid #F3C9C5}
.fb .why{display:block;font-weight:400;color:var(--ink);margin-top:4px;font-size:14.5px}

/* speak */
.target{background:var(--teal-lt);border:1px solid #CBE2E4;border-left:6px solid var(--teal);border-radius:12px;padding:16px 18px;font-size:21px;font-weight:600;color:var(--navy);line-height:1.35}
body[dir=rtl] .target{border-left:1px solid #CBE2E4;border-right:6px solid var(--teal)}
.mic{width:96px;height:96px;border-radius:50%;background:var(--gold);border:0;font-size:40px;display:block;margin:20px auto 8px;box-shadow:0 6px 20px rgba(201,162,39,.4)}
.mic.rec{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(179,38,30,.5)}70%{box-shadow:0 0 0 20px rgba(179,38,30,0)}100%{box-shadow:0 0 0 0 rgba(179,38,30,0)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;justify-content:center}
.chips span{padding:5px 11px;border-radius:999px;font-size:15px;font-weight:600;background:#EDEFF6;color:var(--muted)}
.chips span.hit{background:var(--ok-lt);color:var(--ok)}
.score{text-align:center;font-family:Fraunces,Georgia,serif;font-size:44px;font-weight:700;color:var(--navy);margin-top:6px}
.score small{display:block;font-family:Inter,sans-serif;font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* reading */
.passage{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:18px 20px;font-size:17.5px;line-height:1.72}
.passage h3{font-size:20px;color:var(--navy);margin-bottom:8px}
.passage p{margin:0}

/* write */
textarea{width:100%;border:2px solid var(--rule);border-radius:12px;padding:13px 15px;font-family:inherit;font-size:17px;line-height:1.5;resize:vertical;min-height:84px;color:var(--ink)}
textarea:focus{outline:0;border-color:var(--navy)}
.frame{font-size:19px;font-weight:600;color:var(--navy);background:var(--mist);border-radius:10px;padding:12px 15px;margin-bottom:10px}

/* conversation */
.bub{max-width:84%;border-radius:16px;padding:12px 16px;margin-bottom:10px;font-size:16.5px;line-height:1.45}
.bub.them{background:var(--paper);border:1px solid var(--rule);border-bottom-left-radius:4px}
.bub.you{background:var(--navy);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
body[dir=rtl] .bub.you{margin-left:0;margin-right:auto}
.who{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}

/* me / stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:14px 10px;text-align:center}
.stat b{display:block;font-family:Fraunces,Georgia,serif;font-size:30px;color:var(--navy);line-height:1}
.stat small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.25}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.badge.got{background:var(--gold-lt);border-color:var(--gold);color:var(--navy-dk)}
input[type=text]{width:100%;border:2px solid var(--rule);border-radius:12px;padding:12px 15px;font-family:inherit;font-size:17px}
input[type=text]:focus{outline:0;border-color:var(--navy)}

/* certificate */
#certsheet{display:none}
@media print{
  body{background:#fff;padding:0}
  header,nav.tabs,main{display:none!important}
  #certsheet{display:block!important;padding:0}
  .certbox{border:10px solid var(--navy);padding:60px 50px;text-align:center;font-family:Fraunces,Georgia,serif}
  .certbox .cl{font-family:Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:var(--gold);font-weight:700}
  .certbox h1{font-size:44px;margin:14px 0 26px;color:var(--navy)}
  .certbox .nm{font-size:40px;border-bottom:2px solid var(--navy);display:inline-block;padding:0 40px 6px;margin-bottom:22px}
  .certbox p{font-family:Inter,sans-serif;font-size:16px;color:#333}
}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--navy-dk);color:#fff;padding:11px 20px;border-radius:999px;font-size:15px;font-weight:600;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.en,body[dir=rtl] .opt,body[dir=rtl] .bub,body[dir=rtl] .target,body[dir=rtl] .passage,body[dir=rtl] .frame,body[dir=rtl] textarea,body[dir=rtl] .wd .tx b,body[dir=rtl] .wd .tx .ex,body[dir=rtl] .chips,body[dir=rtl] .who,body[dir=rtl] .unit .tx small{direction:ltr;unicode-bidi:isolate;text-align:left}
#elg-btn{bottom:96px!important}
@media print{#elg,#elg-btn{display:none!important}}
@media (min-width:620px){.langs{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>

  var pool=ss.slice(), hits=[];
  tt.forEach(function(w){

function stageDone(id,st){var d=S.done[id];return !!(d&&d.indexOf(st)>=0)}
function markStage(id,st){if(!S.done[id])S.done[id]=[];if(S.done[id].indexOf(st)<0){S.done[id].push(st);addXp(12)}save()}
function addXp(n){S.xp=(S.xp||0)+n;save();var e=$('#hXp');if(e)e.textContent=S.xp+' XP'}
function touchStreak(){
  var td=today();
  if(S.streak.d===td)return;
  var y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak.n=(S.streak.d===y)?(S.streak.n+1):1;
  S.streak.d=td;save();
}
function wordsLearned(){var n=0;for(var k in S.srs){if(k.charAt(0)==='w'&&S.srs[k].b>=2)n++}return n}
function unitsDone(){var n=0;UNITS.forEach(function(u){if(unitDone(u.id))n++});return n}
function toast(msg){var d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}

/* ---------- srs ---------- */
function srsAdd(k){if(!S.srs[k])S.srs[k]={b:0,due:dayNum()}}
function srsHit(k,ok){
  var it=S.srs[k]||{b:0,due:dayNum()};
  it.b=ok?Math.min(4,it.b+1):0;
  it.due=dayNum()+[0,1,2,4,8][it.b];
  S.srs[k]=it;save();
}
function allWords(){var a=[];UNITS.forEach(function(u){u.words.forEach(function(w){a.push({u:u.id,w:w})})});return a}
function dueItems(){
  var d=dayNum(), out=[], seen={};
  allWords().forEach(function(x){
    var k='w:'+x.w.w, it=S.srs[k];
    if(it&&it.due<=d){out.push({t:'w',k:k,d:x.w});seen[k]=1}
  });
  GRAMMAR.forEach(function(g,i){var k='g:'+i,it=S.srs[k];if(it&&it.due<=d)out.push({t:'g',k:k,d:g,i:i})});
  // top up with new material from units at or before the student's position
  if(out.length<14){
    var pos=furthest();
    allWords().forEach(function(x){
      if(out.length>=14)return;
      var k='w:'+x.w.w;if(S.srs[k])return;
      var ui=UNITS.findIndex(function(u){return u.id===x.u});
      if(ui<=pos){srsAdd(k);out.push({t:'w',k:k,d:x.w})}
    });
  }
  if(out.length<18){
    GRAMMAR.forEach(function(g,i){
      if(out.length>=18)return;
      var k='g:'+i;if(S.srs[k])return;srsAdd(k);out.push({t:'g',k:k,d:g,i:i});
    });
  }
  return shuffle(out).slice(0,18);
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
function furthest(){var last=S.start||0;UNITS.forEach(function(u,i){if(unitDone(u.id)&&i>last)last=i});return Math.min(UNITS.length-1,last+1)}

/* ---------- render router ---------- */
function render(){
  window.scrollTo(0,0);
  var top=stack[stack.length-1];
  if(top){
    if(top.v==='place')return viewPlace();
    if(top.v==='unit')return viewUnit(top.id,top.stage||0);
    if(top.v==='conv')return viewConv(top.id);
    if(top.v==='drill')return viewDrill();
  }
  showBack(null);
  if(tab==='path')return viewPath();
  if(tab==='daily')return viewDailyHome();
  if(tab==='talk')return viewTalkHome();
  return viewMe();
}
function push(o){stack.push(o);render()}
function pop(){stack.pop();render()}

/* ---------- unit stages ---------- */
var STAGES=['words','listen','speak','read','write'];
function viewUnit(id,stage){
  var u=null;UNITS.forEach(function(x){if(x.id===id)u=x});
  if(!u){stack=[];return render()}
  showBack(function(){ if(stage>0){stack[stack.length-1].stage=stage-1;render()} else pop(); });
  setTitle(u.title[S.lang]||u.title.en);
  var bar='<div class="steps">'+STAGES.map(function(s,i){return '<div class="'+(i<stage?'ok':(i===stage?'on':''))+'"></div>'}).join('')+'</div>';
  var go=function(){
    markStage(u.id,STAGES[stage]);
    if(stage<4){stack[stack.length-1].stage=stage+1;render()}
    else{touchStreak();unitFinish(u)}
  };
  if(stage===0)return stWords(u,bar,go);
  if(stage===1)return stListen(u,bar,go);
  if(stage===2)return stSpeak(u,bar,go);
  if(stage===3)return stRead(u,bar,go);
  return stWrite(u,bar,go);
}

function viewDrill(){
  showBack(pop);setTitle(t('daily'));
  var items=dueItems(), i=0, right=0;
  if(!items.length){view.innerHTML='<div class="card"><div class="fb good">'+esc(t('drillDone'))+'</div></div>';return}
  function one(){
    if(i>=items.length){
      touchStreak();S.drill={d:today(),n:items.length};save();
      view.innerHTML='<div class="card" style="text-align:center"><div style="font-size:48px">⚡</div>'+
        '<h2 style="font-size:24px;color:var(--navy)">'+right+' / '+items.length+'</h2>'+
        '<p class="muted">'+esc(t('drillDone'))+'</p>'+
        '<button class="btn block sp" id="bk">'+esc(t('done'))+'</button></div>';
      $('#bk').onclick=pop;return;
    }
    var it=items[i], q, opts, ans, why='';
    if(it.t==='w'){
      var w=it.d, pool=shuffle(allWords().filter(function(x){return x.w.w!==w.w})).slice(0,2);
      if(S.lang==='en'||!w.t[S.lang]){
        q=w.s.replace(new RegExp(w.w,'i'),'______');
        opts=shuffle([w.w,pool[0].w.w,pool[1].w.w]);ans=opts.indexOf(w.w);
      }else{
        q=w.t[S.lang];
        opts=shuffle([w.w,pool[0].w.w,pool[1].w.w]);ans=opts.indexOf(w.w);
      }
    }else{q=it.d.q;opts=it.d.opts;ans=it.d.a;why=it.d.why}
    var qcls=(it.t==='g')?' class="en"':'';
    view.innerHTML='<div class="steps">'+items.map(function(_,j){return '<div class="'+(j<i?'ok':(j===i?'on':''))+'"></div>'}).join('')+'</div>'+
      '<div class="card"><p class="k t">'+(i+1)+' / '+items.length+' · '+(it.t==='w'?esc(t('words')):'Grammar')+'</p>'+
      '<div'+qcls+' style="font-size:21px;font-weight:600;color:var(--navy);margin:6px 0 2px">'+esc(q)+'</div>'+
      '<div class="opts" id="do"></div><div id="df"></div></div>';
    var box=$('#do');
    opts.forEach(function(o,oi){
      var b=document.createElement('button');b.className='opt';b.textContent=o;
      b.onclick=function(){
        if(box.dataset.lock)return;box.dataset.lock='1';
        var ok=oi===ans;b.classList.add(ok?'good':'bad');
        if(!ok)box.children[ans].classList.add('good');else{right++;addXp(5)}
        srsHit(it.k,ok);
        if(it.t==='w')say(it.d.w,'en-US');
        $('#df').innerHTML='<div class="fb '+(ok?'good':'bad')+'">'+esc(ok?t('correct'):t('notyet'))+(why?'<span class="why">'+esc(why)+'</span>':'')+'</div>';
        setTimeout(function(){i++;one()},ok?750:1500);
      };
      box.appendChild(b);
    });
  }
  one();
}

/* ---------- conversations ---------- */
function viewTalkHome(){
  setTitle(t('talk'));
  var html='<div class="card"><p class="k">💬 '+esc(t('talk'))+'</p><p class="muted" style="margin:6px 0 0">'+esc(t('talkIntro'))+'</p></div>';
  LEVELS.forEach(function(L,li){
    var any=CONVS.filter(function(c){return c.lv===li});
    if(!any.length)return;
    html+='<div class="lvhead"><span class="dot" style="background:'+L.color+'"></span><h2>'+esc(t(L.k))+'</h2></div>';
    any.forEach(function(c){
      html+='<button class="unit '+(S.convs[c.id]?'done':'')+'" data-c="'+c.id+'"><span class="ic">'+c.icon+'</span>'+
        '<span class="tx"><b>'+esc(c.title[S.lang]||c.title.en)+'</b><small>'+esc(c.who)+'</small></span>'+
        '<span class="st">'+(S.convs[c.id]?'✓':'→')+'</span></button>';
    });
  });
  view.innerHTML=html;
  view.querySelectorAll('.unit').forEach(function(b){b.onclick=function(){push({v:'conv',id:b.dataset.c})}});
}
function viewConv(id){
  var c=null;CONVS.forEach(function(x){if(x.id===id)c=x});
  if(!c){pop();return}
  showBack(pop);setTitle(c.title[S.lang]||c.title.en);
  var turn=0, log=[];
  function draw(){
    var html='<div class="card" style="padding:16px"><p class="who">'+esc(c.who)+'</p><div id="thread">';
    log.forEach(function(m){html+='<div class="bub '+(m.me?'you':'them')+'">'+esc(m.x)+'</div>'});
    html+='</div></div><div id="ctl"></div>';
    view.innerHTML=html;
    var ctl=$('#ctl');
    if(turn>=c.turns.length){
      S.convs[c.id]=1;addXp(30);touchStreak();save();
      ctl.innerHTML='<div class="card" style="text-align:center"><div style="font-size:42px">🎉</div><p style="font-weight:600;color:var(--navy)">'+esc(t('convDone'))+'</p><button class="btn block sp" id="bk">'+esc(t('done'))+'</button></div>';
      $('#bk').onclick=pop;return;
    }
    var T=c.turns[turn];
    if(!log.length||log[log.length-1].me||log[log.length-1].x!==T.say){
      log.push({x:T.say,me:false});say(T.say,'en-US',1);return draw();
    }
    ctl.innerHTML='<p class="k t" style="margin-bottom:6px">'+esc(t('yourTurn'))+'</p><p class="tiny muted" style="margin:0 0 8px">'+esc(t('pickReply'))+'</p>'+
      '<div class="opts" id="rp"></div>';
    var box=$('#rp');
    T.reply.forEach(function(r){
      var b=document.createElement('button');b.className='opt';b.textContent=r;
      b.onclick=function(){chooseReply(r)};
      box.appendChild(b);
    });
  }
  function chooseReply(r){
    view.innerHTML='<div class="card"><p class="who">'+esc(t('yourTurn'))+'</p><div class="target">'+esc(r)+'</div>'+
      '<div class="row sp" style="justify-content:center"><button class="btn ghost sm" id="hear">🔊 '+esc(t('listen'))+'</button></div>'+
      '<button class="mic" id="mic">🎤</button><p class="tiny muted" style="text-align:center" id="stat">'+esc(SR?t('tapRecord'):t('noMic'))+'</p>'+
      '<div id="res"></div><div class="row sp" style="justify-content:center"><button class="btn sm" id="ok">'+esc(t('done'))+'</button></div></div>';
    $('#hear').onclick=function(){say(r,'en-US',1)};
    $('#ok').onclick=function(){log.push({x:r,me:true});turn++;draw()};
    var mic=$('#mic');
    if(!SR){mic.style.opacity=.4;return}
    mic.onclick=function(){
      var rec=new SR();rec.lang='en-US';rec.interimResults=false;
      mic.classList.add('rec');$('#stat').textContent=t('recording');
      rec.onresult=function(ev){
        var said=ev.results[0][0].transcript, sc=scoreSaid(r,said);
        $('#res').innerHTML='<div class="score">'+sc.pct+'%<small>'+esc(t('heard'))+' '+esc(said)+'</small></div>'+
          '<div class="chips">'+sc.words.map(function(w,j){return '<span class="'+(sc.hits[j]?'hit':'')+'">'+esc(w)+'</span>'}).join('')+'</div>';
        $('#stat').textContent=sc.pct>=70?t('correct'):t('again');
        if(sc.pct>=70)addXp(10);
      };
      rec.onerror=function(){mic.classList.remove('rec');$('#stat').textContent=t('noMic')};
      rec.onend=function(){mic.classList.remove('rec')};
      try{rec.start()}catch(e){mic.classList.remove('rec')}
    };
  }
  draw();
}

 {id:'b4',e:'📚',n:{en:'50 words',es:'50 palabras',vi:'50 từ',ar:'٥٠ كلمة',zh:'50个单词',ht:'50 mo'},f:function(){return wordsLearned()>=50}},

];

  html+='<div class="card"><p class="k">'+esc(t('cert'))+'</p>'+
    '<label class="tiny muted">'+esc(t('yourName'))+'</label>'+
    '<input type="text" id="nm" value="'+esc(S.name||'')+'" placeholder="'+esc(t('yourName'))+'">'+
    '<button class="btn block sp" id="pc" '+(unitsDone()<1?'disabled':'')+'>'+esc(t('certGet'))+'</button></div>';
  html+='<div class="card"><p class="k">'+esc(t('placement'))+'</p><button class="btn ghost block sp" id="rp">'+esc(t('placement'))+'</button></div>';
  html+='<div class="card"><p class="tiny muted">'+esc(t('privacy'))+'</p>'+
    '<button class="btn ghost block sp" id="rs" style="border-color:var(--bad);color:var(--bad)">'+esc(t('reset'))+'</button></div>';
  view.innerHTML=html;
  $('#nm').oninput=function(){S.name=this.value;save()};
  $('#pc').onclick=function(){
    $('#certName').textContent=S.name||'—';
    $('#certLine').textContent='has completed '+unitsDone()+' of '+UNITS.length+' units of English On Your Own.';
    $('#certDate').textContent=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
    window.print();
  };
  $('#rp').onclick=function(){push({v:'place'})};
  $('#rs').onclick=function(){
    if(confirm(t('resetSure'))){try{localStorage.removeItem(KEY)}catch(e){}
      S={lang:S.lang,name:'',placed:false,start:0,done:{},srs:{},streak:{d:'',n:0},mins:{d:'',s:0},convs:{},xp:0,drill:{d:'',n:0}};
      save();stack=[];render()}
  };
}

if(!S.lang){openSplash(false)}
else{applyLang();$('#splash').style.display='none';if(!S.placed)stack=[{v:'place'}];render()}
