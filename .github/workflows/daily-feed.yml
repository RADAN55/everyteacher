name: Daily EL feed
on:
  schedule:
    - cron: "40 10 * * *"   # 4:40 a.m. Central (5:40 CDT)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-feed
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds
        run: python3 tools/fetch-feed.py
      - name: Commit if changed
        run: |
          git config user.name "EL Hub feed"
          git config user.email "actions@users.noreply.github.com"
          git add daily/feed.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Daily EL feed $(date -u +%F)" && git pull --rebase origin main && git push; fi
